<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>枪林弹雨 V2 · 战役</title>
<style>
  html,body{margin:0;padding:0;background:#07100a;height:100%;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#cfd8c0;}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:pixelated;background:#07100a;
    box-shadow:0 0 0 2px #243d1e,0 0 40px #000;max-width:100%;max-height:100%;}
  #tip{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:12px;color:#4d6b3c;
    pointer-events:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<script>
"use strict";

/* ===================== 基础常量 ===================== */
var VW = 960, VH = 540;
var TILE = 20, COLS = 230, ROWS = 27;
var WORLD_W = COLS * TILE, WORLD_H = ROWS * TILE;

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ===================== 基础调色板 ===================== */
var BASE = {
  sky1: '#0c1a12', sky2: '#1c3a22', hillFar: '#16361e', hillNear: '#1f4a28',
  grass: '#5a8c30', dirt: '#33491f', dirtDark: '#223015',
  steel: '#5a6068', steelDark: '#363b42', crate: '#8a5a26', crateDark: '#54340f',
  green: '#7fb03a', greenD: '#2f5a1c', red: '#d2422c', gold: '#e0bd3e',
  white: '#e7ecda', ink: '#0a1208', accent: '#46c8d8',
  cloud: 'rgba(255,255,255,0.10)', star: 'rgba(255,255,255,0.8)'
};
var TH = Object.assign({}, BASE);   // 当前关卡主题（drawWorld 使用）

/* ===================== 输入 ===================== */
var keys = {}, just = {};
var mouse = { x: VW / 2, y: VH / 2, down: false, click: false, rclick: false, wheel: 0 };

window.addEventListener('keydown', function (e) {
  // 登录 / 好友搜索：画布内文本输入
  if (state === 'login' || state === 'friends') {
    if (e.key === 'Escape') {
      if (state === 'friends') {
        if (blacklistView) blacklistView = false;
        else if (userListView) userListView = false;
        else if (statsView) statsView = false;
        else if (gfPassView) gfPassView = false;
        else if (friendReqView) friendReqView = false;
        else { friendPickMode = false; state = 'home'; }
      }
      return;
    }
    if (e.key === 'Enter') {
      if (state === 'login') tryLogin();
      else if (gfPassView) submitPass();
      else if (!userListView) addFriendByName(friendSearch);
      return;
    }
    if (e.key === 'Backspace') {
      if (state === 'login') loginFields[loginActive] = loginFields[loginActive].slice(0, -1);
      else if (gfPassView) gfPassBuf = gfPassBuf.slice(0, -1);
      else if (!userListView) friendSearch = friendSearch.slice(0, -1);
      e.preventDefault(); return;
    }
    if (e.key && e.key.length === 1) {
      if (state === 'login') { if (loginFields[loginActive].length < 16) loginFields[loginActive] += e.key; }
      else if (gfPassView) { if (gfPassBuf.length < 24) gfPassBuf += e.key; }
      else if (!userListView) { if (friendSearch.length < 16) friendSearch += e.key; updateSecret(e.key); }
      e.preventDefault(); return;
    }
    return;
  }
  if (!keys[e.code]) just[e.code] = true;
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function (e) {
  keys[e.code] = false;
});
window.addEventListener('blur', function () { keys = {}; mouse.down = false; grenAiming = false; });

cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
cv.addEventListener('mousemove', function (e) {
  var r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (VW / r.width);
  mouse.y = (e.clientY - r.top) * (VH / r.height);
});
cv.addEventListener('mousedown', function (e) {
  var r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (VW / r.width);
  mouse.y = (e.clientY - r.top) * (VH / r.height);
  if (e.button === 1) {            // 鼠标中键：发射手雷（按下瞄准、松开投掷）
    if (state === 'play' && player && !player.dead) grenAiming = true;
    e.preventDefault();            // 阻止浏览器中键自动滚动
    return;
  }
  if (e.button === 2) { mouse.rclick = true; e.preventDefault(); }
  else { mouse.down = true; mouse.click = true; }
});
window.addEventListener('mouseup', function (e) {
  if (e.button === 1) { if (grenAiming) { throwGren(); grenAiming = false; } return; }
  if (e.button === 2) mouse.rclick = false; else mouse.down = false;
});
cv.addEventListener('auxclick', function (e) { if (e.button === 1) e.preventDefault(); });
// 滚轮：用于黑名单等长列表滚动（每帧末尾复位，deltaY 累加进 mouse.wheel）
cv.addEventListener('wheel', function (e) { e.preventDefault(); mouse.wheel += e.deltaY; }, { passive: false });

/* ===================== 音效 ===================== */
var AC = null;
function actx() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
  return AC;
}
function beep(freq, dur, type, vol) {
  var a = actx(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.04;
    o.connect(g); g.connect(a.destination);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.start(); o.stop(a.currentTime + dur);
  } catch (e) {}
}
function boom() {
  var a = actx(); if (!a) return;
  try {
    var len = Math.floor(a.sampleRate * 0.4);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    var s = a.createBufferSource(); s.buffer = buf;
    var g = a.createGain(); g.gain.value = 0.22;
    s.connect(g); g.connect(a.destination); s.start();
  } catch (e) {}
}
var SFX = {
  shot: function () { beep(220 + Math.random() * 60, 0.07, 'square', 0.035); },
  mg: function () { beep(160 + Math.random() * 40, 0.04, 'sawtooth', 0.022); },
  sg: function () { beep(110, 0.14, 'sawtooth', 0.06); },
  rl: function () { beep(90, 0.1, 'square', 0.05); },
  hurt: function () { beep(150, 0.12, 'triangle', 0.07); },
  reload: function () { beep(320, 0.05, 'square', 0.04); setTimeout(function () { beep(200, 0.06, 'square', 0.04); }, 180); },
  die: function () { beep(120, 0.3, 'sawtooth', 0.06); },
  pick: function () { beep(520, 0.07, 'square', 0.04); },
  toss: function () { beep(400, 0.08, 'sine', 0.04); },
  setpt: function () { beep(660, 0.09, 'square', 0.05); setTimeout(function () { beep(880, 0.12, 'square', 0.05); }, 110); },
  crate: function () { beep(150, 0.05, 'square', 0.025); setTimeout(function () { beep(90, 0.05, 'square', 0.018); }, 28); },
  armor: function () { beep(900, 0.05, 'square', 0.05); },
  knife: function () { beep(320 + Math.random() * 90, 0.05, 'sawtooth', 0.03); },
  win: function () { beep(440, 0.12, 'square', 0.05); setTimeout(function () { beep(660, 0.12, 'square', 0.05); }, 140); setTimeout(function () { beep(880, 0.22, 'square', 0.05); }, 280); }
};

function drawLootObj(t, cx, cy) {
  if (t === 1) {                       // 电池
    rr(cx - 2, cy - 7, 4, 3, '#9aa0a6'); rr(cx - 5, cy - 4, 10, 10, '#2c2c30');
    rr(cx - 5, cy - 4, 10, 2, '#46464c'); rr(cx - 3, cy - 1, 6, 2, '#e8e8e8'); rr(cx - 3, cy + 2, 6, 2, '#e8e8e8');

    rr(cx - 4, cy - 6, 8, 13, '#2f7d32'); rr(cx - 4, cy - 6, 8, 2, '#cfd2d4'); rr(cx - 4, cy - 1, 8, 3, '#e8f5e9');
  } else if (t === 3 || t === 4) {     // 宝石（蓝/紫）
    var gc = (t === 3) ? '#3f7fd8' : '#9b4fd0';
    ctx.fillStyle = gc; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx + 6, cy - 2); ctx.lineTo(cx + 4, cy + 6); ctx.lineTo(cx - 4, cy + 6); ctx.lineTo(cx - 6, cy - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6); ctx.stroke();
  } else if (t === 5) {                // 咖啡
    rr(cx - 5, cy - 3, 9, 9, '#f3ece0'); rr(cx - 5, cy - 3, 9, 2, '#caa37a');
    ctx.strokeStyle = '#f3ece0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx + 6, cy + 1, 3, -1.2, 1.2); ctx.stroke();
    rr(cx - 3, cy - 7, 1, 3, '#fff'); rr(cx + 1, cy - 7, 1, 3, '#fff');
  } else {                             // 钻石（红，最贵）
    ctx.fillStyle = '#dff3ff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx + 6, cy - 2); ctx.lineTo(cx, cy + 7); ctx.lineTo(cx - 6, cy - 2); ctx.closePath(); ctx.fill(); ctx.stroke();

function drawLootIcon(t, cx, cy) {

function tileAt(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return 0;
  return tiles[r * COLS + c];
}
function solidAt(c, r) { return tileAt(c, r); }
function moveX(e, vx) {
  e.x += vx;
  if (overlapSolid(e)) {
    if (vx > 0) e.x = Math.floor((e.x + e.w) / TILE) * TILE - e.w - 0.01;
    else if (vx < 0) e.x = (Math.floor(e.x / TILE) + 1) * TILE + 0.01;
    return true;
  }
  return false;
}
function moveY(e, vy) {
  e.y += vy;
  e.onGround = false;
  if (overlapSolid(e)) {
    if (vy > 0) { e.y = Math.floor((e.y + e.h) / TILE) * TILE - e.h - 0.01; e.onGround = true; }
    else if (vy < 0) e.y = (Math.floor(e.y / TILE) + 1) * TILE + 0.01;
    return true;
  }
  return false;
}
function overlapSolid(e) {
  var c0 = Math.floor(e.x / TILE), c1 = Math.floor((e.x + e.w - 1) / TILE);
  var r0 = Math.floor(e.y / TILE), r1 = Math.floor((e.y + e.h - 1) / TILE);
  for (var c = c0; c <= c1; c++)
    for (var r = r0; r <= r1; r++)
      if (solidAt(c, r)) return true;
  return false;
}
function hasLOS(x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1, dist = Math.sqrt(dx * dx + dy * dy);
  var steps = Math.ceil(dist / 8);
  for (var i = 1; i < steps; i++) {
    var t = i / steps, x = x1 + dx * t, y = y1 + dy * t;
    if (solidAt(Math.floor(x / TILE), Math.floor(y / TILE))) return false;
  }
  return true;
}
function groundBelow(ent) {
  var c = Math.floor((ent.x + ent.w / 2) / TILE);
  if (c < 0) c = 0; if (c >= COLS) c = COLS - 1;
  var r = Math.floor(ent.y / TILE);
  while (r < ROWS && !solidAt(c, r)) r++;
  return r * TILE;
}

var duelSeed = null;        // 当前对局种子；非 null 时地形生成走确定性随机
var _srndState = 0;
function srndSeed(s) { _srndState = (s >>> 0) || 1; }
function srnd() {           // mulberry32 确定性伪随机
  _srndState |= 0; _srndState = (_srndState + 0x6D2B79F5) | 0;
  var t = Math.imul(_srndState ^ (_srndState >>> 15), 1 | _srndState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function gRand() { return (duelSeed !== null) ? srnd() : Math.random(); }

function genWorld(idx) {
  var L = LEVELS[idx];
  TH = Object.assign({}, BASE, L.theme);
  DIFF = DIFFS[DIFFKEY];
  LS = DIFF.lenMul;
  COLS = Math.round(230 * LS); WORLD_W = COLS * TILE;
  ROWS = 27; WORLD_H = ROWS * TILE;
  tiles = new Uint8Array(COLS * ROWS);
  hm = new Array(COLS);
  ladders = []; redFlags = []; respawnFlag = null; keyHouses = []; houseCrates = {}; extractFlag = null;
  rope = null; plane = null;
  var g = L.ground;          // [amp, freq, base, rough, minRow, maxRow, floorRow]
  var floorRow = g[6];
  var topR = Math.min(g[4], g[5]);                  // 地表最高处（泥土最少）
  var botR = Math.max(g[4], g[5]);                  // 地表最低处（泥土最多）
  var valley = Math.min(ROWS - 2, botR + 2);        // 向下拓展谷地 → 更多起伏
  for (var c = 0; c < COLS; c++) {
    // 多层正弦叠加，制造连绵起伏的地形
    var n = 0.5 + 0.45 * Math.sin(c * g[1]) + 0.22 * Math.sin(c * g[1] * 2.7 + 1.3) + 0.12 * Math.sin(c * g[1] * 5.3 + 0.7);
    if (n < 0) n = 0; if (n > 1) n = 1;
    var h = Math.round(topR + (valley - topR) * n + (gRand() * 2 - 1) * g[3] * 1.4);
    if (h < topR) h = topR;
    if (h > valley) h = valley;
    hm[c] = h;
    for (var r = h; r < ROWS; r++) tiles[r * COLS + c] = 1;
  }
  for (var i = 0; i < L.plat.length; i++) {
    var pl = L.plat[i];
    for (var x = 0; x < pl[2]; x++) tiles[pl[1] * COLS + (pl[0] + x)] = 2;
  }
  for (var i = 0; i < L.lad.length; i++) {
    var ld = L.lad[i];
    var botC = Math.min(ld[2], hm[ld[0]]);          // 梯子底端落到地表，不再插进地下
    ladders.push({ c: ld[0], top: ld[1], bot: botC });
  }
  for (var i = 0; i < L.crates.length; i += 2) {
    tiles[L.crates[i + 1] * COLS + L.crates[i]] = 3;
  }
  var goalC = L.goalC;
  flag = { x: goalC * TILE + 10, y: hm[goalC] * TILE, h: 70 };
  rope = { x: (goalC + 3) * TILE, top: 0, bot: hm[goalC] * TILE };
  plane = { x: (goalC + 5) * TILE, y: -60 };
  spawn = { x: 90, y: hm[4] * TILE - 40 };
  // 红旗（敌方据点 / 复活点）仅「地狱」难度出现；简单/困难无红旗
  if (DIFFKEY === 2) {
    var rcols = [Math.floor(COLS * 0.28), Math.floor(COLS * 0.55), Math.floor(COLS * 0.8)];
    for (var i = 0; i < rcols.length; i++) {
      var rc = Math.max(10, Math.min(COLS - 10, rcols[i]));
      redFlags.push({ x: rc * TILE + 10, y: hm[rc] * TILE, captured: false, holdT: 0, spawnT: 0 });
    }
  }
  // 房卡房门：仅战役。沿地图分布若干，等级 1~6，房内木箱数 = 2 + (lv-1)*2
  var hcols = [Math.floor(COLS * 0.34), Math.floor(COLS * 0.62), Math.floor(COLS * 0.82)];
  for (var hi = 0; hi < hcols.length; hi++) {
    var hc = Math.max(12, Math.min(COLS - 12, hcols[hi]));
    var hlv = 1 + ((LEVEL * 2 + hi) % 6);
    keyHouses.push({ c: hc, x: hc * TILE + 4, y: hm[hc] * TILE, lv: hlv, opened: false });
  }
  // 撤离点房门：靠近撤离点，开启会触发远处进攻旗（等级随关卡递增，仅作挑战/奖励，不阻挡撤离）
  var ec = Math.max(12, goalC - 4);
  keyHouses.push({ c: ec, x: ec * TILE + 4, y: hm[ec] * TILE, lv: Math.min(6, 3 + LEVEL), opened: false, extraction: true });
  // 撤离点进攻红旗：常驻于撤离点，每 10 秒召唤一个随机敌兵（不含抢旗手）；不再依赖开门
  if (!funMode) extractFlag = { x: ec * TILE + 10, y: hm[ec] * TILE, spawnT: 0 };
}

function puff(x, y, n, col, spd) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, s = (Math.random() * 0.6 + 0.3) * spd;
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5, life: 14 + Math.random() * 10, max: 24, s: 1 + Math.random() * 2, col: col });

function hurtPlayer(d, isBullet) {
  if (player.dead) return;
  if (player.invuln > 0 && d < 999) return;   // 无敌期间免伤（落坑仍致死）
  if (isBullet && player.armor > 0 && player.armorHp > 0) {   // 护甲抵挡子弹：每发消耗 1 点耐久，不掉血
    player.armorHp--; player.hurtT = 120; SFX.armor();
    return;
  }
  player.hp -= d;
  player.hurtT = 220;
  shake = Math.min(10, shake + d * 0.18);
  SFX.hurt();
  if (player.hp <= 0) {
    player.hp = 0; player.dead = true; player.deadT = 0;
    stats.deaths++; SFX.die();
    corpses.push({ x: player.x, y: player.y, face: player.face, helm: TH.greenD, t: 0 });
    dropDeathBox();   // 主武器与背包掉进木盒；手枪/手雷/血包保留
  }
}

// 死亡：除手枪/手雷/血包外，所有主武器 + 背包掉进地上的木盒
function dropDeathBox() {
  if (funMode) return;
  var cargo = [];
  for (var i = BAR_PISTOL; i < player.bar.length; i++) {
    if (player.bar[i] && player.bar[i] !== 'pistol') { cargo.push(player.bar[i]); player.bar[i] = null; }
  }
  for (var j = player.bag.length - 1; j >= 0; j--) cargo.push(player.bag[j]);
  if (player.items) for (var k2 = 0; k2 < player.items.length; k2++) cargo.push({ item: true, tier: player.items[k2].tier });
  var droppedBag = player.bagLv;
  player.bag = []; player.bagLv = 0; player.items = [];     // 背包容器与物资也掉落
  if (cargo.length === 0 && droppedBag === 0) return;
  deathBoxes.push({ x: player.x, y: player.y, w: 30, h: 26, cargo: cargo, bagLv: droppedBag, taken: false, t: 0 });
  pickActiveWp();
}

// 按 H 开盒：取回木盒里的装备 + 背包
function tryOpenBox() {
  if (funMode) return;
  for (var i = 0; i < deathBoxes.length; i++) {
    var b = deathBoxes[i];
    if (b.taken) continue;
    if (Math.abs((player.x + player.w / 2) - (b.x + b.w / 2)) < 44 && Math.abs((player.y + player.h) - (b.y + b.h)) < 56) {
      retrieveBox(b); deathBoxes.splice(i, 1); bannerText = '已取回木盒装备'; bannerT = 1600; return;
    }
  }
}
function retrieveBox(b) {
  player.bagLv = Math.max(player.bagLv, b.bagLv || 0);
  for (var i = 0; i < b.cargo.length; i++) {
    var gk = b.cargo[i];
    if (gk && gk.item) {
      if (player.items.length < ITEM_CAP) player.items.push({ tier: gk.tier });
      else drops.push({ type: 'item', tier: gk.tier, x: player.x, y: player.y + 10, w: 14, h: 14, t: 0, vy: 0 });
      continue;
    }
    if (ownsGun(gk)) { player.mag[gk] = WEAPONS[gk].mag; continue; }
    var slot = freeBarSlot(gunKind(gk));
    if (slot >= 0) player.bar[slot] = gk;
    else if (bagRoom() > 0) player.bag.push(gk);
    else drops.push({ type: 'gun', gun: gk, mag: WEAPONS[gk].mag, x: player.x, y: player.y + 10, w: 26, h: 12, t: 0, vy: 0, gold: false });
  }
  pickActiveWp();
}

// 每帧：敌人可能抢走木盒（装备挂在敌人身上，杀了它木盒才重新掉落）
function updateDeathBoxes() {
  if (funMode) return;
  for (var i = deathBoxes.length - 1; i >= 0; i--) {
    var b = deathBoxes[i];
    if (b.taken) { deathBoxes.splice(i, 1); continue; }
    b.t += 1;
    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (en.dead) continue;
      if (Math.abs((en.x + en.w / 2) - (b.x + b.w / 2)) < 22 && Math.abs((en.y + en.h) - (b.y + b.h)) < 30) {
        en.carryBox = { cargo: b.cargo, bagLv: b.bagLv };
        b.taken = true;
        break;
      }
    }
  }
}

function explode(x, y, rad, dmg, fromPlayer, kill) {
  boom(); shake = Math.min(14, shake + 8);
  var R = rad * TILE;
  for (var i = 0; i < 26; i++) {
    var a = Math.random() * Math.PI * 2, s = Math.random() * 4 + 1;
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 20 + Math.random() * 16, max: 36, s: 2 + Math.random() * 2, col: Math.random() < 0.5 ? '#ffae5a' : '#ffd27a' });
  }
  var c0 = Math.floor((x - R) / TILE), c1 = Math.floor((x + R) / TILE);
  var r0 = Math.floor((y - R) / TILE), r1 = Math.floor((y + R) / TILE);
  for (var c = c0; c <= c1; c++) for (var r = r0; r <= r1; r++) {
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) continue;
    var dx = (c * TILE + 10) - x, dy = (r * TILE + 10) - y;
    if (dx * dx + dy * dy <= R * R && tiles[r * COLS + c] === 3) breakCrate(c, r);
  }
  if (fromPlayer) {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i]; if (e.dead) continue;
      var dx = (e.x + e.w / 2) - x, dy = (e.y + e.h / 2) - y;
      var dist2 = dx * dx + dy * dy;
      if (dist2 <= R * R) {
        if (kill) killEnemy(e);
        else { var f = 1 - Math.sqrt(dist2) / R; if (f < 0.15) f = 0.15; hurtEnemy(e, Math.max(1, Math.round(dmg * f))); }
      }
    }
  } else if (!player.dead) {
    var dx = (player.x + player.w / 2) - x, dy = (player.y + player.h / 2) - y;
    var dist2b = dx * dx + dy * dy;
    if (dist2b <= R * R) { var pf = 1 - Math.sqrt(dist2b) / R; if (pf < 0.15) pf = 0.15; hurtPlayer(Math.round(dmg * ENEMY_DMG_MUL * pf)); }
  }
}

// 反弹枪范围伤害：以 (x,y) 为圆心、radiusPx 为半径内的所有敌人各受一次等量伤害
function splashDamage(x, y, radiusPx, dmgPct) {
  if (!radiusPx || radiusPx <= 0) return;
  var R2 = radiusPx * radiusPx;
  for (var j = 0; j < enemies.length; j++) {
    var e = enemies[j]; if (e.dead) continue;
    var dx = (e.x + e.w / 2) - x, dy = (e.y + e.h / 2) - y;
    if (dx * dx + dy * dy <= R2) hurtEnemy(e, e.maxHp * dmgPct / 100);
  }
}

// 反弹枪子弹撞墙：按入墙前的位置判断轴向，翻转对应速度并回到入墙前的坐标
function reflectBullet(b, ox, oy, c, r) {
  var oc = Math.floor(ox / TILE), orow = Math.floor(oy / TILE);
  var bx = (oc !== c) && solidAt(oc, r);
  var by = (orow !== r) && solidAt(c, orow);
  if (bx && !by) b.vx = -b.vx;
  else if (by && !bx) b.vy = -b.vy;
  else { b.vx = -b.vx; b.vy = -b.vy; }
  b.x = ox; b.y = oy;
}

function breakCrate(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  if (tiles[r * COLS + c] !== 3) return;
  tiles[r * COLS + c] = 0;
  for (var i = 0; i < 10; i++) puff(c * TILE + 10, r * TILE + 10, 1, TH.crate, 2);
  var x0 = c * TILE, y0 = r * TILE;
  var hk = houseCrates[c * ROWS + r];   // 房卡房内的木箱记录其房卡等级，否则为野外箱
  crateRoll(x0, y0, hk ? hk : 0);
}

// 统一掉落：houseLv>0 表示房卡房内木箱（爆率更高），0 表示野外木箱（爆率÷2）
function crateRoll(x0, y0, houseLv) {
  var house = houseLv > 0;
  var dm = (DIFF && DIFF.dropMul) ? DIFF.dropMul : 1;
  var gm = (DIFFKEY === 1) ? 1.3 : (DIFFKEY === 2 ? 1.6 : 1);   // 困难/地狱「好东西」概率更高
  var fm = house ? 1 : 0.5;             // 野外木箱除以2（难度越高的模式整体爆率更高）
  // 武器（房卡房有概率出金色超级火箭炮）；困难/地狱额外提升好东西概率
  if (Math.random() < (house ? 0.30 : 0.15) * fm * dm * gm) {
    var pool = house ? ['pistol', 'shotgun', 'mg', 'rocket', 'bounce', 'urocket'] : ['pistol', 'shotgun', 'mg', 'rocket', 'bounce'];
    var g = pool[(Math.random() * pool.length) | 0];
    var gold = (g === 'urocket');
    drops.push({ type: 'gun', gun: g, mag: WEAPONS[g].mag, x: x0 + 2, y: y0, w: 26, h: 12, t: 0, vy: 0, gold: gold });
    if (gold) for (var gi = 0; gi < 14; gi++) puff(x0 + 10, y0 + 8, 1, '#ffd86a', 2.6);
  }
  // 手雷
  if (Math.random() < (house ? 0.15 : 0.08) * fm * dm)
    drops.push({ type: 'gren', x: x0 + 4, y: y0, w: 12, h: 12, t: 0, vy: 0 });
  // 金币（仅战役）
  if (!funMode && Math.random() < (house ? 0.7 : 0.35) * fm * dm)
    drops.push({ type: 'coin', val: 2 + (Math.random() * 4 | 0) + (house ? 2 : 0), x: x0 + 6, y: y0, w: 10, h: 10, t: 0, vy: 0 });
  // 房卡 + 变卖物（仅战役）；困难/地狱房卡更易出，且更易出高级卡
  if (!funMode) {
    if (Math.random() < (house ? 0.14 : 0.09) * fm * dm * gm) {
      var clv;
      if (house) {
        var up = (DIFFKEY >= 1 && Math.random() < 0.5) ? 2 : 1;   // 困难/地狱有更高概率掉落进阶卡
        clv = Math.min(6, houseLv + up);
      } else {
        clv = 1 + (Math.random() * 3 | 0);                        // 野外掉 1~3 级，可开启低级房
      }
      drops.push({ type: 'card', lv: clv, x: x0 + 3, y: y0 - 2, w: 14, h: 14, t: 0, vy: 0 });
    }
    if (Math.random() < (house ? 0.18 : 0.05) * fm * dm) {
      var slv = house ? 1 + (Math.random() * 6 | 0) : 1 + (Math.random() * 3 | 0);
      drops.push({ type: 'sell', lv: slv, x: x0 + 3, y: y0 - 2, w: 14, h: 14, t: 0, vy: 0 });
    }
    // 收集物（六色战利品：白/绿/蓝/紫/金/红；红最高 1 万）：全关卡全难度都可出红/金，房卡房&高难偏向高阶
    if (Math.random() < (house ? 0.26 : 0.16) * fm * dm * gm * ITEM_DROP_MUL) {
      var it, r2 = Math.random();
      if (house) {
        if (DIFFKEY >= 2) {            // 地狱：高阶占比最高
          if (r2 < 0.22) it = 6; else if (r2 < 0.45) it = 5; else if (r2 < 0.68) it = 4; else if (r2 < 0.85) it = 3; else if (r2 < 0.95) it = 2; else it = 1;
        } else if (DIFFKEY >= 1) {     // 困难
          if (r2 < 0.16) it = 6; else if (r2 < 0.36) it = 5; else if (r2 < 0.58) it = 4; else if (r2 < 0.78) it = 3; else if (r2 < 0.92) it = 2; else it = 1;
        } else {                       // 简单（房卡房）：红/金仍可出
          if (r2 < 0.10) it = 6; else if (r2 < 0.26) it = 5; else if (r2 < 0.50) it = 4; else if (r2 < 0.72) it = 3; else if (r2 < 0.88) it = 2; else it = 1;
        }
      } else {                         // 野外：各级均可出，红色概率低但存在
        if (r2 < 0.05) it = 6; else if (r2 < 0.15) it = 5; else if (r2 < 0.35) it = 4; else if (r2 < 0.60) it = 3; else if (r2 < 0.82) it = 2; else it = 1;
      }
      drops.push({ type: 'item', tier: it, x: x0 + 3, y: y0 - 2, w: 14, h: 14, t: 0, vy: 0 });
    }
    // 词条书（紫/金/红 三档；给枪械加词条变强；房卡房更易出高阶）
    if (!funMode && Math.random() < (house ? 0.16 : 0.05) * fm * dm) {
      var bt = house ? (Math.random() < 0.15 ? 6 : (Math.random() < 0.45 ? 5 : 4)) : (Math.random() < 0.2 ? 5 : 4);
      drops.push({ type: 'book', tier: bt, x: x0 + 3, y: y0 - 2, w: 14, h: 14, t: 0, vy: 0 });
    }
  }
}

function hurtEnemy(e, dmg, raw) {
  if (e.dead) return;
  if (e.remote) { e.hurtT = 160; return; }   // 真实对战：对手血量只由远端快照决定，本地绝不结算
  dmg = raw ? dmg : dmg * DIFF.dmgMul;
  e.hp -= dmg;
  e.hurtT = 160;
  if (e.hp <= 0) {
    e.hp = 0; e.dead = true; e.deadT = 0;
    stats.kills++;
    corpses.push({ x: e.x, y: e.y, face: e.face, helm: e.t.helm, t: 0 });
    for (var i = 0; i < 8; i++) puff(e.x + 9, e.y + 18, 1, '#a04030', 2);
    if (Math.random() < 0.4) drops.push({ type: 'gun', gun: e.t.drop, mag: WEAPONS[e.t.drop].mag, x: e.x, y: e.y + 20, w: 26, h: 12, t: 0, vy: 0 });
    if (Math.random() < 0.25) drops.push({ type: 'gren', x: e.x + 4, y: e.y + 20, w: 12, h: 12, t: 0, vy: 0 });
    if (!funMode && Math.random() < 0.85) drops.push({ type: 'coin', val: Math.max(2, Math.floor(e.t.hp / 30)), x: e.x + 4, y: e.y + 20, w: 10, h: 10, t: 0, vy: 0 });
  }
}

function killEnemy(e) {
  if (e.dead) return;
  e.hp = 0; e.dead = true; e.deadT = 0;
  stats.kills++;
  corpses.push({ x: e.x, y: e.y, face: e.face, helm: e.t.helm, t: 0 });
  for (var i = 0; i < 8; i++) puff(e.x + 9, e.y + 18, 1, '#a04030', 2);
  if (Math.random() < 0.4) drops.push({ type: 'gun', gun: e.t.drop, mag: WEAPONS[e.t.drop].mag, x: e.x, y: e.y + 20, w: 26, h: 12, t: 0, vy: 0 });
  if (Math.random() < 0.25) drops.push({ type: 'gren', x: e.x + 4, y: e.y + 20, w: 12, h: 12, t: 0, vy: 0 });
  if (!funMode && Math.random() < 0.85) drops.push({ type: 'coin', val: Math.max(2, Math.floor(e.t.hp / 30)), x: e.x + 4, y: e.y + 20, w: 10, h: 10, t: 0, vy: 0 });
  if (e.carryBox) { deathBoxes.push({ x: e.x, y: e.y, w: 30, h: 26, cargo: e.carryBox.cargo.slice(), bagLv: e.carryBox.bagLv, taken: false, t: 0 }); e.carryBox = null; }
}

function respawn() {
  var x, y;
  if (player.respawn) { x = player.respawn.x; y = player.respawn.y; }
  else { var c = Math.floor((spawn.x + 9) / TILE); x = spawn.x; y = hm[c] * TILE - player.h; }
  player.x = x; player.y = y; player.vx = 0; player.vy = 0;
  player.dead = false; player.deadT = 0; player.hp = player.maxHp;
  player.noGun = false; player.onLadder = null; player.crouch = false; player.h = 38;
  player.invuln = 5000;   // 复活后 5 秒无敌（期间不可开火、免伤）
  if (!funMode) {
    if (player.reviveCoins > 0) player.reviveCoins--;        // 优先消耗复活币
    else player.coins = Math.max(0, player.coins - RESPAWN_COST);
  }
}
// 阵亡菜单选择复活：战役扣 RESPAWN_COST 金；金币不足则直接游戏结束
function doRespawn() {

  resultInfo = { win: false, final: false, time: Math.round(elapsed / 1000), kills: stats.kills, deaths: stats.deaths }; state = 'result';
}

function grenadeLaunch() {
  var ox = player.x + player.w / 2, oy = player.y + 14;
  var mwx = mouse.x + cam.x, mwy = mouse.y + cam.y;
  var ang = Math.atan2(mwy - oy, mwx - ox);
  var sp = 8.5;
  return { ox: ox, oy: oy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1.6 };
}
function simGrenade(ox, oy, vx, vy) {
  var pts = [], x = ox, y = oy, gx = vx, gy = vy, land = null;
  for (var i = 0; i < 140; i++) {
    gy += 0.42; x += gx; y += gy;
    var c = Math.floor(x / TILE), r = Math.floor(y / TILE);
    if (solidAt(c, r) || y > WORLD_H) { land = { x: x, y: y }; break; }
    if (i % 2 === 0) pts.push({ x: x, y: y });
    if (y > WORLD_H + 200) break;
  }
  if (!land) land = { x: x, y: y };
  return { pts: pts, land: land };
}
function throwGren() {
  // 无敌期间允许投弹：开火（子弹）被禁，但手雷不受无敌限制，可照常投掷
  if (!player || player.dead) return;
  if (player.grens <= 0 && !grenInfinite()) return;   // 仅简单难度可无限投掷，其余需有库存
  var L = grenadeLaunch();
  grens.push({ x: L.ox, y: L.oy, w: 8, h: 8, vx: L.vx, vy: L.vy, t: 0 });
  if (!grenInfinite()) { player.grens--; player.consumedValue += SHOP_PRICES.grenade; }   // 战役模式按库存递减并计入战损
  SFX.toss();
}

function reloadTime(w) {
  var t = w.reload;
  if (w.autoReload) t *= 0.95;                          // RPG / 超级火箭炮 换弹速度 +5%
  if (w.key === 'mg' && player.mag['mg'] > 0) t *= 0.5; // 机枪：仍有余弹时换弹减半（仅本次）
  return t;
}
function tryReload() {
  if (player.reloadT > 0 || player.noGun || player.wp === 'knife') return;
  var w = WEAPONS[player.wp];
  if (player.mag[player.wp] >= w.mag) return;
  if (player.reserve <= 0) return;
  player.reloadT = reloadTime(w);
  player.reloadDur = player.reloadT;
  SFX.reload();
}
function finishReload() {
  var w = WEAPONS[player.wp];
  var need = w.mag - player.mag[player.wp];
  var take = Math.min(need, player.reserve);
  player.mag[player.wp] += take;
  player.reserve -= take;
}

function playerShoot() {
  var p = player;
  if (p.dead || p.noGun || !p.wp) return;
  if (p.invuln > 0) return;   // 无敌期间不可开火
  if (p.wp === 'knife') { playerKnife(); return; }
  var w = WEAPONS[p.wp];
  if (p.reloadT > 0) return;
  var cost = w.volley ? w.volley : 1;            // 超级火箭炮：一次打 5 颗
  if (!funMode) {
    if (p.mag[p.wp] < cost) { tryReload(); return; }
    p.mag[p.wp] -= cost;
    player.consumedValue += cost * BULLET_COST;   // 打掉的子弹计入战损
  }
  p.fireT = gRate(p.wp);
  stats.shots++;
  var mx = mouse.x + cam.x, my = mouse.y + cam.y;
  var px = p.x + p.w / 2, py = p.y + (p.crouch ? 12 : 14);
  var ang = Math.atan2(my - py, mx - px);
  var n = w.volley ? w.volley : w.pellets;
  var sp = w.volley ? 0.16 : w.spread;          // 5 连发带小幅散布
  var life = Math.round(w.range / w.speed);
  if (w.bounce) life += w.bounce * 5;           // 反弹枪：为多次弹跳预留飞行时间
  var _startLen = bullets.length;
  for (var i = 0; i < n; i++) {
    var a = ang + (Math.random() * 2 - 1) * sp;
    var sx = Math.cos(a), sy = Math.sin(a);
    bullets.push({ x: px + sx * 16, y: py + sy * 16, vx: sx * w.speed, vy: sy * w.speed, life: life, dmg: gDmg(p.wp), explosive: !!w.explosive, bounce: w.bounce || 0, splash: w.splash ? w.splash * 10 : 0, pierce: w.pierce || 0, hit: [] });
  }
  // 真实 1V1：把本帧新生成的子弹作为事件加入外发队列，供对手端模拟命中（对方才是伤害结算方）
  if (duelMode && !duelTraining && duelFoe) {
    for (var bi = _startLen; bi < bullets.length; bi++) {
      var bb = bullets[bi];
      duelOutQueue.push({ id: duelBulletSeq++, x: bb.x, y: bb.y, vx: bb.vx, vy: bb.vy, life: bb.life, dmg: bb.dmg, explosive: !!bb.explosive, splash: bb.splash || 0, wkey: p.wp });
    }
  }
  p.noise = 1.0;
  SFX[w.key === 'mg' ? 'mg' : w.key === 'shotgun' ? 'sg' : (w.key === 'rocket' || w.key === 'urocket') ? 'rl' : 'shot']();
}

function playerKnife() {
  var p = player;
  // 仅在「贴脸」（最近敌人进入近战范围）时才能挥刀；否则无法攻击且不消耗冷却
  var px = p.x + p.w / 2, py = p.y + p.h / 2;
  var best = null, bestD = Infinity;
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i]; if (e.dead) continue;
    var d = Math.hypot((e.x + e.w / 2) - px, (e.y + e.h / 2) - py);
    if (d < bestD) { bestD = d; best = e; }
  }
  if (!best || bestD > WEAPONS.knife.range) return;   // 没贴脸 → 不可攻击
  p.fireT = WEAPONS.knife.rate;            // 每一秒挥一次
  stats.shots++;
  if (best.remote) { p.noise = 0.3; SFX.knife(); return; }   // 真实对战：不近战秒杀远端对手，仅空挥
  hurtEnemy(best, best.maxHp / 3, true);   // 一次刀造成 1/3 敌方血量（不受难度伤害系数影响）
  p.noise = 0.3;
  SFX.knife();
}

function dropWeapon() {
  if (player.noGun || player.dead || player.wp === 'knife') return;   // 持刀时不可收起（刀是默认近战，无枪即自动持有）
  player.noGun = true;   // 收起武器（背包仍拥有，按 1/2/3 重新装备）
  SFX.toss();
}
function tryPickup() {
  for (var i = 0; i < drops.length; i++) {
    var d = drops[i];
    if (Math.abs((d.x + d.w / 2) - (player.x + player.w / 2)) < 24 && Math.abs((d.y + d.h / 2) - (player.y + player.h / 2)) < 30) {
      if (d.type === 'gren') { if (player.grens < GREN_CAP) { player.grens++; player.lootedValue += SHOP_PRICES.grenade; } drops.splice(i, 1); SFX.pick(); return; }
      if (d.type === 'gun') {
        var gk = d.gun;
        if (ownsGun(gk)) {
          player.mag[gk] = WEAPONS[gk].mag;
          if (player.bar.indexOf(gk) >= 0) { player.wp = gk; player.noGun = false; }
          drops.splice(i, 1); SFX.pick(); return;
        }
        if (!canCarry(gk)) return;   // 武器栏与背包都无空位
        var k = gunKind(gk), slot = freeBarSlot(k);
        if (slot >= 0) { player.bar[slot] = gk; player.wp = gk; player.noGun = false; }
        else { player.bag.push(gk); }
        player.mag[gk] = d.mag; player.lootedValue += gunVal(gk);
        drops.splice(i, 1); SFX.pick(); return;
      }

function enemyShoot(e) {
  var ex = e.x + e.w / 2, ey = e.y + 14;
  var px = player.x + player.w / 2, py = player.y + 18;
  var ang = Math.atan2(py - ey, px - ex);
  var spread = 0.09;
  var pellets = e.t.pellets || 1;
  for (var i = 0; i < pellets; i++) {
    var a = ang + (Math.random() * 2 - 1) * spread;
    var sx = Math.cos(a), sy = Math.sin(a);
    var bs = e.t.bspeed || 8;
    ebullets.push({ x: ex + sx * 16, y: ey + sy * 16, vx: sx * bs, vy: sy * bs, life: Math.round(e.t.range / bs), dmg: [e.t.dmg[0] * ENEMY_DMG_MUL, e.t.dmg[1] * ENEMY_DMG_MUL], explosive: !!e.t.explosive });
  }
  SFX[e.t.w === 'mg' ? 'mg' : e.t.w === 'shotgun' ? 'sg' : e.t.w === 'rocket' ? 'rl' : 'shot']();

function buyWeapon(wk) {
  if (!player || player.dead) return;
  if (ownsGun(wk)) return;
  if (!canCarry(wk)) return;
  var price = SHOP_PRICES[wk];
  if (price === undefined) return;          // 不可购买的枪（urocket / bounce 等）直接拒绝，避免金币变 NaN
  if (player.coins < price) return;
  player.coins -= price;
  var k = gunKind(wk), slot = freeBarSlot(k);
  if (slot >= 0) { player.bar[slot] = wk; player.wp = wk; player.noGun = false; }
  else { player.bag.push(wk); }
  player.mag[wk] = WEAPONS[wk].mag;
  player.reserve += WEAPONS[wk].mag;

}

function buyHealth() {

function buyArmor(tier) {

function armorSub(t) {

function buyBook(tier) {

// 用卡包内对应等级房卡开启房卡房门：消耗一张卡的耐久，刷出 2+(lv-1)*2 个房卡房木箱，并必掉一张进阶房卡
function openKeyHouse(h) {
  if (!h || h.opened) return;
  h.opened = true;
  var n = 2 + (h.lv - 1) * 2;
  for (var k = 0; k < n; k++) {
    var col2 = h.c + 1 + k;
    if (col2 > COLS - 5) col2 = h.c - 1 - k;
    if (col2 < 4 || col2 > COLS - 4) continue;
    var r = hm[col2];
    tiles[r * COLS + col2] = 3;
    houseCrates[col2 * ROWS + r] = h.lv;
  }
  drops.push({ type: 'card', lv: Math.min(6, h.lv + 1), x: h.x + 2, y: h.y - 30, w: 14, h: 14, t: 0, vy: 0 });
  SFX.setpt();
  bannerText = '已开启 ' + h.lv + ' 级房卡房！'; bannerT = 1800;
  // 撤离点进攻由常驻的 extractFlag 负责（见 genWorld），开门不再触发刷兵
}
// 尝试用卡包开门（V 键 / 点门触发）：从卡包取对应等级房卡，按难度扣耐久；任意≥1 耐久的卡都能强行开门（扣剩余耐久，归零作废）
function tryOpenDoor(h) {
  if (!h || h.opened || !player) return;
  var arr = player.cardPack[h.lv];
  if (!arr || arr.length === 0) { bannerText = '卡包内需要 K' + h.lv + ' 房卡（仓库「装入卡包」）'; bannerT = 1600; return; }
  if (arr[0] < 1) { arr.shift(); return; }                 // 防御：耐久非法则丢弃该卡
  var cost = (DIFFKEY === 2) ? 3 : 2;                     // 简单/困难 -2，地狱 -3
  var deduct = Math.min(cost, arr[0]);                    // 耐久不足也能强行开门，扣掉剩余耐久
  arr[0] -= deduct;
  if (arr[0] <= 0) { arr.shift(); player.consumedValue += (CARD_PRICES[h.lv] || 0); }   // 耐久耗尽 → 该卡作废，计入战损
  openKeyHouse(h);
}

/* ===================== 娱乐关卡（垂直爬山跑酷） ===================== */
function genFunWorld(lv) {
  TH = Object.assign({}, BASE, FUN_THEME);
  var W = Math.max(4, Math.round(12 - lv * 0.9));                       // 平台宽度：12 → 4（越窄越难落脚）
  var gapV = 5 + Math.floor(lv * 0.45);                                // 平台间垂直落差：5 → 9 行（越高越难爬、摔得越狠）
  var offH = Math.max(1, Math.min(W - 2, 1 + Math.floor(lv * 0.4)));   // 水平错位（恒 < 平台宽，保证与下台重叠可架梯）
  var nP = 10;
  var rise = 3 + gapV * (nP - 1);
  ROWS = rise + 6; WORLD_H = ROWS * TILE;             // 世界随难度变高
  COLS = 48; WORLD_W = COLS * TILE;
  tiles = new Uint8Array(COLS * ROWS);
  hm = new Array(COLS).fill(0);
  ladders = []; redFlags = []; respawnFlag = null; keyHouses = []; houseCrates = {}; funPlats = []; extractFlag = null;
  var floorRow = ROWS - 3;
  for (var c = 0; c < COLS; c++) { hm[c] = floorRow; for (var r = floorRow; r < ROWS; r++) tiles[r * COLS + c] = 1; }
  function plat(c0, row, w) { for (var i = 0; i < w; i++) tiles[row * COLS + (c0 + i)] = 2; }
  var plats = [];
  var col = 6, row = floorRow - 3, dir = 1;
  for (var k = 0; k < nP; k++) {
    col = Math.max(2, Math.min(COLS - W - 2, col));
    plat(col, row, W);
    plats.push({ c: col, r: row, w: W });
    if (k < nP - 1) {
      var ncol = col + offH * dir;
      if (ncol < 2 || ncol + W > COLS - 2) { dir *= -1; ncol = col + offH * dir; }
      ncol = Math.max(2, Math.min(COLS - W - 2, ncol));
      var lo = Math.max(col, ncol), hi = Math.min(col + W - 1, ncol + W - 1);
      var lc = Math.floor((lo + hi) / 2);              // 重叠区正中架梯，两端平台都够得着
      ladders.push({ c: lc, top: row - gapV, bot: row });
      col = ncol; row = row - gapV;
    }
  }
  funPlats = plats;
  var topP = plats[plats.length - 1];
  flag = { x: (topP.c + Math.floor(topP.w / 2)) * TILE + 10, y: topP.r * TILE, h: 70 };
  rope = null; plane = null;
  spawn = { x: (plats[0].c + 2) * TILE, y: (floorRow - 2) * TILE };
  funGoalX = 0;
  funGoalY = topP.r * TILE;                            // 到达顶端平台即胜利
}
function spawnFunEnemies(lv) {

  var types = [0, 2, 1, 4, 2, 5, 1, 4, 2, 0];         // 敌方实力恒定（不随难度变化）
  for (var i = 1; i < funPlats.length; i++) {

/* ===================== 更新 ===================== */
function update(dt) {
  elapsed += dt;
  if (shake > 0) shake -= dt * 0.03;
  if (shake < 0) shake = 0;
  if (bannerT > 0) bannerT -= dt;
  updateWorld(dt);
  if (just['Escape'] && state === 'play') state = 'pause';
  else if (just['Escape'] && state === 'pause') state = 'play';
}

function updateWorld(dt) {
  var p = player;

  // 全模式（含跑酷）：禁止无限/超额血量。一旦出现（非有限或 >1000），直接钳制为 1000 血。
  if (p) {
    if (!isFinite(p.maxHp) || p.maxHp > 1000 || !isFinite(p.hp) || p.hp > 1000) {
      p.maxHp = 1000;
      if (!isFinite(p.hp) || p.hp > 1000) p.hp = 1000;
      else if (p.hp < 0) p.hp = 0;
    }
  }

  // 真实 1V1：回合结束冻结期（服务器权威），冻结双方输入，仅推进子弹/粒子
  if (duelMode && !duelTraining && duelPhase === 'respawn') {
    stepDuel(dt); stepProjectiles(dt); stepRemoteBullets(dt); stepParticles(dt);
    return;
  }

  if (p.dead) {
    if (duelMode) { stepDuel(dt); stepProjectiles(dt); stepRemoteBullets(dt); stepParticles(dt); return; }  // 1V1：交由 stepDuel 处理（计入对手得分并复活）
    p.deadT += dt;
    var canRevive = funMode || player.reviveCoins > 0 || player.coins >= RESPAWN_COST;
    // 死亡动画期间点击：立刻弹出复活菜单（或没钱时直接结算），避免点击被“吃掉”显得点不动
    if (mouse.click && p.deadT > 300) {
      mouse.click = false;   // 消费该次点击，避免同一帧又触发菜单按钮
      if (funMode) respawn();
      else if (canRevive) state = 'dead';
      else { resultInfo = { win: false, final: false, time: Math.round(elapsed / 1000), kills: stats.kills, deaths: stats.deaths }; state = 'result'; }
    } else if (p.deadT > 1400) {
      if (funMode) { respawn(); }                 // 跑酷：免费自动复活
      else if (canRevive) { state = 'dead'; }     // 战役：弹复活选项
      else { resultInfo = { win: false, final: false, time: Math.round(elapsed / 1000), kills: stats.kills, deaths: stats.deaths }; state = 'result'; }  // 没钱复活 → 直接嘎屁
    }
    stepProjectiles(dt); stepParticles(dt);
    return;
  }

  /* --- 噪音 --- */
  var moving = false, noiseTarget = 0;
  var sprint = !p.onLadder && p.onGround && !p.crouch && !keys['KeyS'] && (keys['ShiftLeft'] || keys['ShiftRight']) && (keys['KeyA'] || keys['KeyD']);
  if (p.onLadder) noiseTarget = 0.15;
  else if (sprint) { moving = true; noiseTarget = 1.8; }            // 疾跑：噪音极大
  else if (keys['KeyA'] || keys['KeyD']) { moving = true; noiseTarget = p.crouch ? 0.3 : 1; }
  else if (p.crouch) noiseTarget = 0;   // 蹲着不动：无噪音
  else noiseTarget = 0;                  // 站立不动：无噪音（潜行关键）
  p.noise += (noiseTarget - p.noise) * Math.min(1, dt / 120);
  p.sprint = !!sprint;
  var hearR = 60 + p.noise * 300 * DIFF.hearMul;

  /* --- 左右移动 --- */
  if (!p.onLadder) {
    var baseSpd = p.crouch ? 1.15 : 2.75;
    var spd = sprint ? 4.4 : baseSpd;
    if (!p.onGround) spd = Math.max(spd, 3.9);   // 空中水平速度提升 → 跳跃距离更长
    if (keys['KeyA']) { p.vx = -spd; p.face = -1; }
    else if (keys['KeyD']) { p.vx = spd; p.face = 1; }
    else p.vx *= 0.7;
    if (Math.abs(p.vx) < 0.05) p.vx = 0;
  } else p.vx = 0;

  /* --- 下蹲 --- */
  var wantCrouch = !!keys['KeyS'] && p.onGround && !p.onLadder;
  if (wantCrouch && !p.crouch) { p.y += 14; p.h = 24; p.crouch = true; }
  else if (!wantCrouch && p.crouch) {
    p.y -= 14; p.h = 38; p.crouch = false;
    if (solidAt(Math.floor((p.x + p.w / 2) / TILE), Math.floor((p.y + p.h / 2) / TILE))) { p.y += 14; p.h = 24; p.crouch = true; }
  }
  if (!p.onLadder) p.face = (mouse.x + cam.x) > (p.x + p.w / 2) ? 1 : -1;

  /* --- 梯子 / 绳梯 --- */
  if (just['Space']) {
    if (p.onLadder) { p.onLadder = null; }
    else {
      var L = nearLadder(p);
      if (L) { p.onLadder = L; p.vy = 0; }
      else if (ropeReady && nearRope(p)) { p.onLadder = { rope: true }; p.vy = 0; }
    }
  }
  if (p.onLadder) {
    p.vy = 0; p.climbT += dt;
    var L2 = p.onLadder;
    if (L2.rope) {
      p.x += (rope.x - 6 - p.x) * 0.3;
      if (keys['KeyW']) p.y -= 2.6;
      if (keys['KeyS']) p.y += 2.6;
      if (p.y < rope.top + 10) { if (!duelMode) winGame(); return; }
      if (p.y > rope.bot) { p.onLadder = null; }
    } else {
      p.x += (L2.c * TILE + 1 - p.x) * 0.3;
      if (keys['KeyW']) p.y -= 2.4;
      if (keys['KeyS']) p.y += 2.4;
      if (p.y + p.h < L2.top * TILE + 6) { p.onLadder = null; }
      if (p.y > L2.bot * TILE) { p.onLadder = null; }
    }
  } else {
    p.vy += 0.62;
    if (p.vy > 15) p.vy = 15;
    if (just['KeyW'] && p.onGround) { p.vy = -13.6; p.onGround = false; }   // 跳得更高、更远
  }

  /* --- 落坑 --- */
  if (p.y > WORLD_H + 80) { hurtPlayer(999); }

  /* --- 娱乐关卡：爬到顶端即胜利（垂直） --- */
  if (funMode && !p.dead && p.y < funGoalY) { winGame(); return; }

  var wasGround = p.onGround;
  p.onGround = false;
  var intendVx = p.vx;
  var blockedX = moveX(p, p.vx);
  if (blockedX && wasGround && p.vy >= 0) {
    var sx = p.x, sy = p.y, climbed = false;
    for (var s = 1; s <= 3; s++) {
      p.x = sx; p.y = sy - s * TILE;
      if (!overlapSolid(p) && !moveX(p, intendVx)) { climbed = true; break; }
    }
    if (!climbed) { p.x = sx; p.y = sy; }
  }
  moveY(p, p.vy);

  if (moving && p.onGround) { p.walk += Math.abs(p.vx) * 0.18; if (Math.random() < 0.06) puff(p.x + p.w / 2, p.y + p.h, 1, TH.dirtDark, 0.6); }

  /* --- 换弹 / 射击 --- */
  if (p.reloadT > 0) { p.reloadT -= dt; if (p.reloadT <= 0) { p.reloadT = 0; finishReload(); } }
  if (p.fireT > 0) p.fireT -= dt;
  if (p.hurtT > 0) p.hurtT -= dt;
  if (p.invuln > 0) p.invuln -= dt;

  var w = WEAPONS[p.wp];
  mouseJust = mouse.down && !lastMouseDown;
  if (mouse.down && p.fireT <= 0 && p.reloadT <= 0 && !p.onLadder && (w.auto || mouseJust)) playerShoot();
  if (just['KeyR']) tryReload();
  if (w.autoReload && p.mag[p.wp] < (w.volley ? w.volley : 1) && p.reloadT <= 0 && !p.noGun && p.reserve > 0) tryReload();   // RPG / 超级火箭炮 自动换弹
  if (just['KeyQ']) dropWeapon();
  if (just['Digit1'] && p.bar[0]) { p.wp = p.bar[0]; p.noGun = false; }
  if (just['Digit2'] && p.bar[1]) { p.wp = p.bar[1]; p.noGun = false; }
  if (just['Digit3'] && p.bar[2]) { p.wp = p.bar[2]; p.noGun = false; }
  if (just['KeyF']) {
    if (!p.hasRig) { bannerText = '没有胸挂，无法使用血包'; bannerT = 1200; }
    else if (p.healthPacks > 0 && p.hp < p.maxHp) { p.healthPacks--; p.hp = Math.min(p.maxHp, p.hp + 300); p.consumedValue += SHOP_PRICES.health; SFX.pick(); }
  }
  if (just['KeyB'] && !funMode) { state = 'bag'; return; }   // 战斗中按 B 打开背包/仓库界面
  if (just['KeyE'] && !funMode) { state = 'bag'; return; }   // 打开背包/仓库界面
  if (just['KeyT'] && !funMode) placeC4();                   // 安放 C4
  if (just['KeyC'] && !funMode) detonateC4();                // 引爆 C4
  if (just['KeyH'] && !funMode) tryOpenBox();                // 开死亡木盒捡回装备
  if (just['KeyV'] && !funMode && nearDoor) tryOpenDoor(nearDoor);   // 用卡包开门（消耗耐久）
  if (mouse.rclick) { tryPickup(); mouse.rclick = false; }

  /* --- 东端目标旗坚守（仅普通战役） --- */
  if (!funMode && !duelMode) {
    var dflag = Math.abs((p.x + p.w / 2) - flag.x);
    if (!ropeReady && dflag < 80) {
      holdTimer += dt;
      if (holdTimer >= 10000) {
        ropeReady = true; rope.active = true;
        SFX.win();
      }
    } else if (!ropeReady) holdTimer = Math.max(0, holdTimer - dt * 0.5);
  }

  /* --- 红旗：战役模式为固定据点，站 5 秒夺取为复活点；未夺取时持续刷敌 --- */
  if (!funMode && !duelMode) {
    for (var fi = 0; fi < redFlags.length; fi++) {
      var rf = redFlags[fi];
      var onF = Math.abs((p.x + p.w / 2) - rf.x) < 30 && Math.abs((p.y + p.h) - rf.y) < 16 && p.onGround && !p.onLadder;
      if (!rf.captured) {
        if (onF) {
          rf.holdT += dt;
          if (rf.holdT >= 5000) {
            for (var fk = 0; fk < redFlags.length; fk++) redFlags[fk].captured = false;   // 同时仅一面生效
            rf.captured = true;
            respawnFlag = rf;
            player.respawn = { x: rf.x - p.w / 2 + 2, y: rf.y - p.h };
            SFX.setpt();
          }
        } else {
          rf.holdT = Math.max(0, rf.holdT - dt * 0.6);
          rf.spawnT += dt;
          if (rf.spawnT >= 1800) {                 // 未夺取时每 1.8s 刷一个敌兵
            rf.spawnT -= 1800;
            if (enemies.length < 60) spawnRandomEnemy(rf.x, rf.y - 16);
          }
        }
      }
    }
    // 撤离点进攻红旗：每 10 秒召唤一个随机敌兵（不含抢旗手）
    if (extractFlag && !duelMode) {
      extractFlag.spawnT += dt;
      if (extractFlag.spawnT >= 10000) {
        extractFlag.spawnT -= 10000;
        if (enemies.length < 60) spawnRandomEnemy(extractFlag.x, extractFlag.y - 16);
      }
    }
  } else if (funMode) {
    /* --- 跑酷模式：保留原来的"跟随玩家"红旗刷敌（仅跑酷，1V1 不刷敌） --- */
    var rp = respawnPoint();
    var rfx = Math.min(WORLD_W - 30, rp.x + RED_FLAG_DX);
    var rfc = Math.floor(rfx / TILE);
    var rfy = (rfc >= 0 && rfc < COLS ? hm[rfc] : rp.y) * TILE;
    redFlag.x = rfx; redFlag.y = rfy;
    var atPoint = Math.abs((p.x + p.w / 2) - rp.x) < RED_FLAG_R && Math.abs((p.y + p.h) - rp.y) < RED_FLAG_R;
    redFlag.active = !atPoint && !p.dead;
    if (redFlag.active) {
      redSpawnT += dt;
      if (redSpawnT >= 1000) {
        redSpawnT -= 1000;
        if (enemies.length < 60) spawnRandomEnemy(redFlag.x, redFlag.y);
      }
    } else {
      redSpawnT = 0;
    }
  }

  /* --- 敌人 --- */
  for (var i = enemies.length - 1; i >= 0; i--) {
    var e = enemies[i];
    if (e.dead) {
      e.deadT += dt;
      if (e.deadT > 2600) enemies.splice(i, 1);
      continue;
    }
    e.hurtT = Math.max(0, e.hurtT - dt);
    var ex = e.x + e.w / 2 - (p.x + p.w / 2), ey = e.y + e.h / 2 - (p.y + p.h / 2);
    var dist = Math.sqrt(ex * ex + ey * ey);

    var detectR = DIFF.detectM * TILE;
    if (detectR > 0 && dist < detectR && hasLOS(p.x + p.w / 2, p.y + p.h / 2, e.x + e.w / 2, e.y + e.h / 2)) {
      e.alert = true; e.alertT = DIFF.alertT;
    }
    if (!e.alert && dist < hearR) { e.alert = true; e.alertT = DIFF.alertT; }
    if (e.alert) {
      e.alertT -= dt;
      if (dist > 900 || e.alertT <= 0) e.alert = false;
    }

    if (e.t.stealer && respawnFlag) {
      // 抢旗手：有激活重生点时，不攻击玩家，径直冲向旗并读条摧毁
      var dxf = respawnFlag.x - (e.x + e.w / 2);
      e.face = dxf < 0 ? -1 : 1;
      if (Math.abs(dxf) > 26) {
        e.vx = e.face * e.t.speed * DIFF.espeed * ENEMY_SPEED_MUL;
      } else {
        e.vx = 0;
        e.stealT += dt;
        if (e.stealT >= STEAL_TIME) {
          respawnFlag.captured = false; respawnFlag.holdT = 0;   // 敌人夺回红旗，复活点失效
          player.respawn = null;
          respawnFlag = null;
          e.stealT = 0;
          SFX.crate();
        }
      }
    } else if (e.alert) {
      e.face = ex < 0 ? 1 : -1;
      if (dist > e.t.range * 0.55) e.vx = e.face * e.t.speed * DIFF.espeed * ENEMY_SPEED_MUL;
      else if (dist < 60) e.vx = -e.face * e.t.speed * 0.5 * DIFF.espeed * ENEMY_SPEED_MUL;
      else e.vx = 0;
      e.fireT -= dt;
      if (e.fireT <= 0 && dist < e.t.range) { enemyShoot(e); e.fireT = e.t.rate * (0.8 + Math.random() * 0.4); }
    } else {
      e.patrol -= dt;
      if (e.patrol <= 0) { e.dir *= -1; e.patrol = 1200 + Math.random() * 2200; }
      e.vx = e.dir * e.t.speed * 0.45 * DIFF.espeed * ENEMY_SPEED_MUL;
      e.face = e.dir;
    }
    e.vy += 0.62; if (e.vy > 15) e.vy = 15;
    e.onGround = false;
    var bx0 = e.x;
    moveX(e, e.vx);
    var blockedX2 = Math.abs(e.x - (bx0 + e.vx)) > 0.5;
    moveY(e, e.vy);
    if (blockedX2) {
      if (!e.alert) e.dir *= -1;
      else if (e.onGround) e.vy = -9;
    }
    if (e.y > WORLD_H + 80) hurtEnemy(e, 9999, true);
    if (Math.abs(e.vx) > 0.1) e.walk += Math.abs(e.vx) * 0.2;
    if (dist < 22 && !p.dead) hurtPlayer(Math.round(3 * ENEMY_DMG_MUL));
  }

  if (duelMode) stepDuel(dt);
  stepProjectiles(dt);
  if (duelMode && !duelTraining) stepRemoteBullets(dt);   // 真实 1V1：模拟对手发来的子弹命中本地玩家
  stepParticles(dt);
  stepDrops(dt);

  if (funMode) {
    cam.y += ((p.y + p.h / 2 - VH / 2) - cam.y) * 0.12;
    if (cam.y < 0) cam.y = 0;
    if (cam.y > WORLD_H - VH) cam.y = WORLD_H - VH;
  } else {
    cam.x += ((p.x + p.w / 2 - VW / 2) - cam.x) * 0.12;
    if (cam.x < 0) cam.x = 0;
    if (cam.x > WORLD_W - VW) cam.x = WORLD_W - VW;
    if (cam.y !== 0) cam.y = 0;
  }

  updateDoors();
  updateDeathBoxes();
}

var lastMouseDown = false, mouseJust = false;

function nearLadder(p) {
  var py = p.y + p.h / 2;
  for (var i = 0; i < ladders.length; i++) {
    var L = ladders[i];
    if (Math.abs((L.c * TILE + 10) - (p.x + p.w / 2)) < 20 && py > L.top * TILE - 10 && py < L.bot * TILE + 20) return L;
  }
  return null;
}
function nearRope(p) {
  var py = p.y + p.h / 2;
  return Math.abs(rope.x - (p.x + p.w / 2)) < 26 && py > rope.top - 10 && py < rope.bot + 30;
}

function stepProjectiles(dt) {
  var i, b;
  for (i = bullets.length - 1; i >= 0; i--) {
    b = bullets[i];
    var bx0 = b.x, by0 = b.y;
    b.x += b.vx; b.y += b.vy; b.life--;
    var c = Math.floor(b.x / TILE), r = Math.floor(b.y / TILE);
    var tHit = tileAt(c, r);
    var consumed = false, doExplode = false;
    var isBouncer = !!b.splash;
    // 命中敌人：反弹枪改用范围伤害，其余子弹单点伤害
    var eh = -1;
    for (var j = 0; j < enemies.length; j++) {
      var e = enemies[j];
      if (e.dead) continue;
      if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) { eh = j; break; }
    }
    if (eh >= 0) {
      var e = enemies[eh];
      if (isBouncer) {
        splashDamage(b.x, b.y, b.splash, b.dmg);
        consumed = true;
      } else if (b.hit.indexOf(e) === -1) {
        // 该敌人尚未被此弹命中过
        hurtEnemy(e, e.maxHp * b.dmg / 100);
        b.hit.push(e);
        if (b.pierce > 0) {
          b.pierce--;                          // 穿透：不消耗，继续飞行
        } else {
          if (b.explosive) doExplode = true;   // 已无穿透 → 引爆（爆炸内直接炸死）
          consumed = true;
        }
      }
      // 已命中的敌人：忽略，继续飞行（避免重复引爆）
    } else if (tHit === 3 || tHit === 1 || tHit === 2) {
      if (isBouncer) {
        if (b.bounce > 0) {                       // 还有反弹次数 → 反弹，不消耗
          reflectBullet(b, bx0, by0, c, r); b.bounce--;
          continue;
        }
        splashDamage(b.x, b.y, b.splash, b.dmg);  // 反弹耗尽 → 落点范围伤害
        consumed = true;
        if (tHit === 1 || tHit === 2) puff(b.x, b.y, 3, '#8a8a6a', 1.4);
      } else if (tHit === 3) {
        // 木箱：玩家子弹 50% 击碎
        if (Math.random() < 0.5) {
          breakCrate(c, r);
          puff(b.x, b.y, 8, TH.crate, 2.2);
          puff(b.x, b.y, 5, TH.crateDark, 1.6);
          SFX.crate();
        } else {
          puff(b.x, b.y, 3, TH.crateDark, 1.4);
        }
        consumed = true;
      } else {
        consumed = true;
        puff(b.x, b.y, 3, '#8a8a6a', 1.4);
      }
    }
    if (b.explosive && (tHit === 1 || tHit === 2 || tHit === 3)) doExplode = true;
    if (doExplode) explode(b.x, b.y, 2, 100, true, true);   // 玩家火箭：2 格半径内直接炸死
    if (consumed || b.life <= 0) {
      if (b.life <= 0 && !consumed && isBouncer) splashDamage(b.x, b.y, b.splash, b.dmg);
      bullets.splice(i, 1);
    }
  }
  for (i = ebullets.length - 1; i >= 0; i--) {
    b = ebullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    var c2 = Math.floor(b.x / TILE), r2 = Math.floor(b.y / TILE);
    var tHit2 = tileAt(c2, r2);
    var ph = !player.dead && b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h;
    var consumed = false, doExplode = false;
    if (tHit2 === 3) {
      // 木箱：敌方子弹 10% 击碎
      if (Math.random() < 0.1) {
        breakCrate(c2, r2);
        puff(b.x, b.y, 7, TH.crate, 2.0);
        puff(b.x, b.y, 4, TH.crateDark, 1.5);
        SFX.crate();
      } else {
        puff(b.x, b.y, 2, TH.crateDark, 1.2);
      }
      consumed = true;
    } else if (tHit2 === 1 || tHit2 === 2) {
      consumed = true;
      puff(b.x, b.y, 3, '#8a8a6a', 1.2);
    }
    if (b.explosive && (tHit2 === 1 || tHit2 === 2 || tHit2 === 3)) doExplode = true;
    if (ph) {
      var dmg = b.dmg[0] + Math.random() * (b.dmg[1] - b.dmg[0]);
      hurtPlayer(Math.round(dmg), true);
      consumed = true;
    }
    if (doExplode) explode(b.x, b.y, 2, 100, true);
    if (consumed || b.life <= 0) ebullets.splice(i, 1);
  }
  for (i = grens.length - 1; i >= 0; i--) {
    var g = grens[i];
    g.t += dt;
    g.vy += 0.42;
    var moved = moveX(g, g.vx);          //  Grenade 现在有 w/h，会撞墙与落地
    if (moved) g.vx *= -0.35;
    var my = moveY(g, g.vy);
    if (my) { g.vy *= -0.32; g.vx *= 0.7; if (Math.abs(g.vy) < 1.2) g.vy = 0; }  // 落地后贴地静止
    g.vx *= 0.995;
    // 不飞出地图左右边界：贴边反弹
    if (g.x < 0) { g.x = 0; g.vx = Math.abs(g.vx) * 0.35; }
    if (g.x + g.w > WORLD_W) { g.x = WORLD_W - g.w; g.vx = -Math.abs(g.vx) * 0.35; }
    // 兜底：万一越过地图底部，贴地
    if (g.y + g.h > WORLD_H) { g.y = WORLD_H - g.h; g.vy = 0; }
    if (g.t > 1500) { explode(g.x + 4, g.y + 4, GRENADE_RAD, 100, true); grens.splice(i, 1); }
  }
}
function stepParticles(dt) {
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.09; p.life--;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (var k = corpses.length - 1; k >= 0; k--) { corpses[k].t++; if (corpses[k].t > 900) corpses.splice(k, 1); }
}
function stepDrops(dt) {
  for (var i = drops.length - 1; i >= 0; i--) {
    var d = drops[i];
    d.t++;
    d.vy += 0.42; if (d.vy > 8) d.vy = 8;
    d.y += d.vy;
    var r = Math.floor((d.y + d.h) / TILE), c = Math.floor((d.x + d.w / 2) / TILE);
    if (solidAt(c, r)) { d.y = r * TILE - d.h; d.vy = 0; }
    if (d.y > WORLD_H + 100) drops.splice(i, 1);
    else if (player && !player.dead) {
      var near = Math.abs((d.x + d.w / 2) - (player.x + player.w / 2)) < 22 && Math.abs((d.y + d.h / 2) - (player.y + player.h / 2)) < 30;
      if (near) {
        if (d.type === 'coin') { player.coins += d.val; player.lootedValue += d.val; drops.splice(i, 1); SFX.pick(); }
        else if (d.type === 'card') { player.cards[d.lv].push(CARD_DURA); player.lootedValue += (CARD_PRICES[d.lv] || 0); drops.splice(i, 1); SFX.pick(); }
        else if (d.type === 'sell') { player.sell[d.lv] = (player.sell[d.lv] || 0) + 1; player.lootedValue += sellVal(d.lv); drops.splice(i, 1); SFX.pick(); }
        else if (d.type === 'item') {
          if (player.items.length < ITEM_CAP) { player.items.push({ tier: d.tier }); player.lootedValue += itemVal(d.tier); drops.splice(i, 1); SFX.pick(); }
          // 收集物已满（达到 ITEM_CAP）则留在地面（不捡）
        }
        else if (d.type === 'book') { player.books[d.tier] = (player.books[d.tier] || 0) + 1; player.lootedValue += BOOK_PRICES[d.tier]; drops.splice(i, 1); SFX.pick(); }
      }
    }
  }
}

/* ===================== 绘制工具 ===================== */
function rr(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
function txt(s, x, y, col, size, align) {
  ctx.fillStyle = col || TH.white;
  ctx.font = (size || 14) + 'px "Microsoft YaHei",sans-serif';
  ctx.textAlign = align || 'left';
  ctx.fillText(s, x | 0, y | 0);
}

function drawSoldier(x, y, w, h, face, col, helm, walk, aim, crouch, gun, climb) {
  var sw = Math.sin(walk) * 4;
  // 腿（移动时左右摆动）
  if (climb) {
    rr(x + 3, y + h - 10, 5, 10, TH.dirtDark);
    rr(x + w - 8, y + h - 10, 5, 10, TH.dirtDark);
  } else {
    rr(x + 2 + sw, y + h - 12, 5, 12, TH.dirtDark);
    rr(x + w - 7 - sw, y + h - 12, 5, 12, TH.dirtDark);
    rr(x + 1 + sw, y + h - 2, 7, 2, TH.ink);
    rr(x + w - 8 - sw, y + h - 2, 7, 2, TH.ink);
  }
  // 身体
  rr(x + 1, y + 10, w - 2, h - 22, col);
  rr(x + 1, y + 10, w - 2, 3, helm);
  // 背包
  rr(x + (face > 0 ? -2 : w - 2), y + 13, 3, 12, TH.dirtDark);
  // 头
  rr(x + 4, y + 2, w - 8, 8, '#c9a882');
  // 钢盔
  rr(x + 2, y, w - 4, 5, helm);
  rr(x + 1, y + 4, w - 2, 2, helm);
  // 护目镜
  rr(x + (face > 0 ? w - 8 : 4), y + 4, 4, 2, '#0e1a0c');
  // 枪 / 刀
  if (aim !== undefined && aim !== null) {
    ctx.save();
    ctx.translate(x + w / 2, y + (crouch ? 12 : 14));
    ctx.rotate(aim);
    if (gun === 'knife') {
      rr(0, -1, 15, 3, '#cfd6dd');     // 刀身（银）
      rr(0, -2, 5, 5, '#5a3a20');      // 刀柄
      rr(14, -2, 2, 5, '#eef3f6');     // 刀尖高光
    } else if (typeof gun === 'string' && GUN_IMG[gun] && GUN_IMG[gun].complete && GUN_IMG[gun].naturalWidth) {
      // 像素武器贴图：随枪口方向旋转，朝左时上下翻转避免枪倒扣
      var gimg = GUN_IMG[gun], gl2 = GUN_LEN[gun] || 20;
      if (aim > Math.PI / 2 || aim < -Math.PI / 2) ctx.scale(1, -1);
      var gih = Math.max(7, gl2 * gimg.naturalHeight / gimg.naturalWidth);
      ctx.drawImage(gimg, 2, -gih / 2, gl2, gih);
    } else {
      var gl = gun || 16;
      rr(0, -2, gl, 4, '#2a2a24');
      rr(gl - 3, -3, 5, 3, '#1a1a16');
    }
    ctx.restore();
  }
}

function drawBackground() {
  var g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, TH.sky1); g.addColorStop(1, TH.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // 星空
  if (TH.stars) {
    ctx.fillStyle = TH.star;
    for (var s = 0; s < 60; s++) {
      var sx = (s * 137 - cam.x * 0.1) % VW; if (sx < 0) sx += VW;
      var sy = (s * 53) % 280 + 10;
      rr(sx, sy, 2, 2, TH.star);
    }
  }
  // 远山
  ctx.fillStyle = TH.hillFar;
  for (var i = 0; i < 14; i++) {
    var bx = ((i * 220) - (cam.x * 0.25)) % (VW + 440) - 220;
    ctx.beginPath(); ctx.moveTo(bx, 420);
    ctx.lineTo(bx + 110, 300 + (i % 3) * 30); ctx.lineTo(bx + 220, 420); ctx.closePath(); ctx.fill();
  }
  // 近山
  ctx.fillStyle = TH.hillNear;
  for (var j = 0; j < 10; j++) {
    var bx2 = ((j * 320) - (cam.x * 0.5)) % (VW + 640) - 320;
    ctx.beginPath(); ctx.moveTo(bx2, 460);
    ctx.lineTo(bx2 + 160, 350 + (j % 4) * 24); ctx.lineTo(bx2 + 320, 460); ctx.closePath(); ctx.fill();
  }
  // 云 / 烟尘
  ctx.fillStyle = TH.cloud;
  for (var k = 0; k < 6; k++) {
    var cxp = ((k * 260) - (cam.x * 0.35)) % (VW + 520) - 260;
    var cyp = 70 + (k % 3) * 40;
    ctx.beginPath(); ctx.ellipse(cxp, cyp, 60, 18, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTerrainRelief() {
  // 地形起伏可视化：近地表偏亮、越深越暗的垂直渐变 + 高亮地表轮廓线
  var c0 = Math.max(0, Math.floor(cam.x / TILE) - 1);
  var c1 = Math.min(COLS - 1, Math.ceil((cam.x + VW) / TILE) + 1);
  var grad = ctx.createLinearGradient(0, 0, 0, WORLD_H);
  grad.addColorStop(0, 'rgba(150,200,110,0.22)');
  grad.addColorStop(0.45, 'rgba(70,110,55,0.06)');
  grad.addColorStop(1, 'rgba(0,0,0,0.30)');
  ctx.beginPath();
  ctx.moveTo(c0 * TILE - cam.x, WORLD_H);
  for (var c = c0; c <= c1; c++) ctx.lineTo(c * TILE - cam.x, hm[c] * TILE);
  ctx.lineTo((c1 + 1) * TILE - cam.x, WORLD_H);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // 地表高亮轮廓
  ctx.beginPath();
  for (var c2 = c0; c2 <= c1; c2++) {
    var x = c2 * TILE - cam.x, y = hm[c2] * TILE;
    if (c2 === c0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(190,225,130,0.9)'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
}

function drawWorld() {
  drawBackground();
  ctx.save();
  ctx.translate(0, -cam.y);

  var c0 = Math.max(0, Math.floor(cam.x / TILE) - 1);
  var c1 = Math.min(COLS - 1, Math.ceil((cam.x + VW) / TILE) + 1);

  // 地形
  for (var c = c0; c <= c1; c++) {
    for (var r = 0; r < ROWS; r++) {
      var t = tiles[r * COLS + c];
      if (!t) continue;
      var sx = c * TILE - cam.x, sy = r * TILE;
      if (t === 1) {
        var top = tileAt(c, r - 1) === 0;
        rr(sx, sy, TILE, TILE, top ? TH.dirt : TH.dirtDark);
        if (top) rr(sx, sy, TILE, 5, TH.grass);
        rr(sx, sy, TILE, 1, 'rgba(0,0,0,0.25)');
      } else if (t === 2) {
        rr(sx, sy, TILE, TILE, TH.steel);
        rr(sx, sy, TILE, 3, TH.steelDark);
        rr(sx + 2, sy + 5, 3, 3, TH.steelDark);
        rr(sx + 13, sy + 12, 3, 3, TH.steelDark);
      } else if (t === 3) {
        rr(sx, sy, TILE, TILE, TH.crate);
        rr(sx, sy, TILE, 3, '#9a6a2e');
        rr(sx + 2, sy + 3, TILE - 4, 2, TH.crateDark);
        rr(sx + 2, sy + TILE - 5, TILE - 4, 2, TH.crateDark);
        rr(sx + 9, sy + 3, 2, TILE - 6, TH.crateDark);
      }
    }
  }
  drawTerrainRelief();
  // 梯子
  for (var li = 0; li < ladders.length; li++) {
    var L = ladders[li];
    var lx = L.c * TILE - cam.x;
    if (lx < -40 || lx > VW + 40) continue;
    rr(lx + 3, L.top * TILE, 3, (L.bot - L.top + 1) * TILE, '#6a5a30');
    rr(lx + 13, L.top * TILE, 3, (L.bot - L.top + 1) * TILE, '#6a5a30');
    for (var ry = L.top; ry <= L.bot; ry++) rr(lx + 3, ry * TILE + 8, 13, 3, '#8a7440');
  }
  // 目标旗 + 绳梯 + 飞机
  drawGoalFlag();
  // 红旗（战役为固定据点，跑酷为跟随刷敌）
  if (funMode) drawRedFlag(); else drawRedFlags();
  // 房卡房门
  drawKeyHouses();
  // 死亡木盒（比木箱大，按 H 开盒捡回）
  for (var bx2 = 0; bx2 < deathBoxes.length; bx2++) {
    var db = deathBoxes[bx2]; if (db.taken) continue;
    var dx2 = db.x - cam.x, dy2 = db.y - cam.y;
    if (dx2 < -60 || dx2 > VW + 60) continue;
    ctx.fillStyle = '#6a4424'; ctx.fillRect(dx2, dy2, db.w, db.h);
    ctx.fillStyle = '#8a5a2e'; ctx.fillRect(dx2 + 3, dy2 + 3, db.w - 6, db.h - 6);
    ctx.strokeStyle = '#caa06a'; ctx.lineWidth = 2; ctx.strokeRect(dx2 + 1, dy2 + 1, db.w - 2, db.h - 2);
    rr(dx2 + 6, dy2 + db.h / 2 - 1, db.w - 12, 3, '#4a2e16');
    txt('盒', dx2 + db.w / 2, dy2 + db.h / 2 + 4, '#ffe', 12, 'center');
    if (Math.abs((player.x + player.w / 2) - (db.x + db.w / 2)) < 44 && Math.abs((player.y + player.h) - (db.y + db.h)) < 56) {
      txt('按 H 开盒', dx2 + db.w / 2, dy2 - 6, TH.gold, 12, 'center');
    }
  }
  // 尸体
  for (var k = 0; k < corpses.length; k++) {
    var cp = corpses[k]; var a = Math.max(0, 1 - cp.t / 900);
    ctx.globalAlpha = a * 0.85;
    drawSoldier(cp.x - cam.x, cp.y + 14, 18, 24, cp.face, '#3a3a30', cp.helm, 0, 0, true, 14, false);
    ctx.globalAlpha = 1;
  }
  // 掉落物
  for (var di = 0; di < drops.length; di++) {
    var d = drops[di];
    var dx = d.x - cam.x;
    if (dx < -60 || dx > VW + 60) continue;
    if (d.type === 'coin') {
      var cxp = dx + 5, cyp = d.y + 5;
      ctx.fillStyle = '#ffcf3a'; ctx.beginPath(); ctx.arc(cxp, cyp, 5, 0, Math.PI * 2); ctx.fill();
      txt(String(d.val), cxp, cyp + 3, '#7a4a00', 9, 'center');
      continue;
    }
    if (d.type === 'card') {
      var ccol = cardCol(d.lv);
      rr(dx + 1, d.y, 12, 16, '#1a1a16'); rr(dx + 2, d.y + 1, 10, 14, ccol);
      rr(dx + 4, d.y + 3, 6, 4, '#ffffff'); rr(dx + 5, d.y + 8, 2, 5, '#ffffff');
      txt('K' + d.lv, dx + 7, d.y - 4, ccol, 9, 'center');
      continue;
    }
    if (d.type === 'sell') {
      var scol = cardCol(d.lv), sgx = dx + 7, sgy = d.y + 7;
      ctx.fillStyle = scol;
      ctx.beginPath(); ctx.moveTo(sgx, sgy - 6); ctx.lineTo(sgx + 6, sgy); ctx.lineTo(sgx, sgy + 6); ctx.lineTo(sgx - 6, sgy); ctx.closePath(); ctx.fill();
      txt(String(sellVal(d.lv)), sgx, sgy + 16, '#ffe9a0', 9, 'center');
      continue;
    }
    if (d.type === 'item') {
      var icol = itemCol(d.tier), igx = dx + 7, igy = d.y + 7;
      drawLootIcon(d.tier, igx, igy);                                  // 对应实物 + 该色轮廓光芒
      txt(itemVal(d.tier) + '金', igx, igy + 16, icol, 9, 'center');   // 站在上面只显示价格
      continue;
    }
    if (d.type === 'book') {
      var bcol = cardCol(d.tier), bgx = dx + 7, bgy = d.y + 7;
      rr(dx + 1, d.y, 12, 16, '#2a1a2a'); rr(dx + 2, d.y + 1, 10, 14, bcol);
      rr(dx + 4, d.y + 3, 6, 10, '#fff8e0');
      txt(TIER_NAMES[d.tier] + '书', dx + 7, d.y - 4, bcol, 8, 'center');
      continue;
    }
    if (d.type === 'gren') {
      rr(dx, d.y, 12, 12, '#3d4a26'); rr(dx + 3, d.y - 3, 3, 4, '#6a7a3a');
      rr(dx + 1, d.y + 3, 10, 2, '#5a6a30');
    } else {
      if (d.gold) {
        var gxa = dx + d.w / 2, gya = d.y + d.h / 2;
        ctx.globalAlpha = 0.3 + 0.22 * Math.sin(elapsed / 120);
        ctx.fillStyle = '#ffd86a';
        ctx.beginPath(); ctx.arc(gxa, gya, 24, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      var gn = WEAPONS[d.gun].name;
      rr(dx, d.y + 3, 26, 5, '#2a2a24'); rr(dx + 6, d.y + 8, 5, 4, '#1a1a16');
      rr(dx + (d.mag > 0 ? 1 : 20), d.y - 2, 5, 5, d.mag > 0 ? (d.gold ? '#ffd86a' : TH.gold) : '#6a6a6a');
      txt(gn, dx + 13, d.y - 5, d.mag > 0 ? (d.gold ? '#ffd86a' : '#c9d6b0') : '#7a7a6a', 10, 'center');
      if (d.gold) txt('★ 稀有掉落 ★', dx + 13, d.y - 18, '#ffd86a', 10, 'center');
    }
  }
  // 敌人
  for (var ei = 0; ei < enemies.length; ei++) {
    var e = enemies[ei];
    var ex = e.x - cam.x;
    if (ex < -80 || ex > VW + 80) continue;
    if (e.dead) {
      var t = Math.min(1, e.deadT / 900);
      ctx.globalAlpha = 1 - t;
      drawSoldier(ex, e.y + t * 16, e.w, e.h, e.face, '#4a4a3a', e.t.helm, 0, t * 1.6, true, 14, false);
      ctx.globalAlpha = 1;
      continue;
    }
    var aimA = Math.atan2((player.y + player.h / 2) - (e.y + 15), (player.x + player.w / 2) - (e.x + e.w / 2));
    drawSoldier(ex, e.y, e.w, e.h, e.face, e.hurtT > 0 ? '#d8a0a0' : e.t.col, e.t.helm, e.walk, aimA, false, 15, false);
    if (e.alert) { rr(ex + e.w / 2 - 3, e.y - 12, 6, 6, TH.red); txt('!', ex + e.w / 2, e.y - 14, TH.red, 12, 'center'); }
    rr(ex - 2, e.y - 6, e.w + 4, 4, '#111');
    rr(ex - 1, e.y - 5, (e.w + 2) * Math.max(0, e.hp / e.maxHp), 2, e.hp > e.maxHp * 0.4 ? TH.green : TH.red);
    txt(e.t.name, ex + e.w / 2, e.y - 10, '#8fa07a', 9, 'center');
    if (e.t.stealer && e.stealT > 0) {
      var sp = Math.min(1, e.stealT / STEAL_TIME);
      rr(ex - 12, e.y - 22, 36, 5, '#111');
      rr(ex - 11, e.y - 21, 34 * sp, 3, '#d04ad0');
      txt('抢夺中', ex + e.w / 2, e.y - 26, '#e08ad0', 9, 'center');
    }
  }
  // 玩家
  if (!player.dead) {
    var px = player.x - cam.x;
    var mwx = mouse.x + cam.x, mwy = mouse.y + cam.y;
    var pang = Math.atan2(mwy - (player.y + (player.crouch ? 12 : 14)), mwx - (player.x + player.w / 2));
    var blink = false;
    if (player.hurtT > 0 && Math.floor(player.hurtT / 60) % 2 === 0) blink = true;
    if (player.invuln > 0 && Math.floor(elapsed / 120) % 2 === 0) blink = true;
    if (blink) ctx.globalAlpha = 0.45;
    drawSoldier(px, player.y, player.w, player.h, player.face, TH.green, TH.greenD, player.walk, pang, player.crouch, player.wp === 'knife' ? 'knife' : (player.noGun ? 0 : player.wp), !!player.onLadder);
    ctx.globalAlpha = 1;
    if (player.invuln > 0) {
      var ax = player.x + player.w / 2 - cam.x, ay = player.y + player.h / 2;
      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(elapsed / 90);
      ctx.strokeStyle = TH.accent; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ax, ay, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 1;
    }
  }
  // 子弹
  for (var bi = 0; bi < bullets.length; bi++) { var b = bullets[bi]; rr(b.x - cam.x - 2, b.y - 1, 6, 3, '#e8d98a'); }
  for (var bj = 0; bj < ebullets.length; bj++) { var b2 = ebullets[bj]; rr(b2.x - cam.x - 2, b2.y - 1, 6, 3, '#e88a5a'); }
  // 手榴弹（飞行中）
  for (var gi = 0; gi < grens.length; gi++) { var gg = grens[gi]; rr(gg.x - cam.x, gg.y, 8, 8, '#3d4a26'); rr(gg.x - cam.x + 2, gg.y - 2, 2, 3, '#6a7a3a'); }
  // 手雷瞄准轨迹
  if (grenAiming && player && !player.dead && (grenInfinite() || player.grens > 0)) {
    var L = grenadeLaunch();
    var sim = simGrenade(L.ox, L.oy, L.vx, L.vy);
    for (var pi = 0; pi < sim.pts.length; pi++) {
      var a2 = 0.85 - pi / sim.pts.length * 0.6;
      ctx.globalAlpha = Math.max(0.2, a2);
      rr(sim.pts[pi].x - cam.x - 1, sim.pts[pi].y - 1, 3, 3, TH.accent);
    }
    ctx.globalAlpha = 1;
    // 落点标记
    var lx2 = sim.land.x - cam.x, ly2 = sim.land.y;
    ctx.strokeStyle = TH.accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lx2, ly2, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx2 - 13, ly2); ctx.lineTo(lx2 + 13, ly2);
    ctx.moveTo(lx2, ly2 - 13); ctx.lineTo(lx2, ly2 + 13); ctx.stroke();
    ctx.lineWidth = 1;
  }
  // 粒子
  for (var pi2 = 0; pi2 < parts.length; pi2++) {
    var p2 = parts[pi2];
    ctx.globalAlpha = Math.max(0, Math.min(1, p2.life / p2.max));
    rr(p2.x - cam.x, p2.y, p2.s, p2.s, p2.col);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // 准星（屏幕坐标，不受镜头偏移影响）
  if (state === 'play' && player && !player.dead) {
    var cx = mouse.x, cy = mouse.y;
    rr(cx - 8, cy - 1, 6, 2, TH.red); rr(cx + 2, cy - 1, 6, 2, TH.red);
    rr(cx - 1, cy - 8, 2, 6, TH.red); rr(cx - 1, cy + 2, 2, 6, TH.red);
  }
}

function drawGoalFlag() {
  if (!flag) return;
  var fx = flag.x - cam.x;
  if (fx > -200 && fx < VW + 200) {
    rr(fx - 2, flag.y - flag.h, 4, flag.h, '#8a8a7a');
    for (var i = 0; i < 22; i++) {
      var wv = Math.sin(elapsed / 200 + i * 0.4) * 3;
      rr(fx + 2 + i * 1.6, flag.y - flag.h + 6 + wv, 1.6, 26, i % 2 ? '#1a2a12' : TH.greenD);
    }
    rr(fx - 8, flag.y - 4, 18, 4, TH.dirtDark);
    if (!funMode) {
      if (!ropeReady) {
        var pct = Math.min(1, holdTimer / 10000);
        rr(fx - 40, flag.y - flag.h - 26, 80, 8, '#111');
        rr(fx - 39, flag.y - flag.h - 25, 78 * pct, 6, TH.gold);
      } else {
        rr(fx - 44, flag.y - flag.h - 22, 88, 14, 'rgba(0,0,0,0.4)');
        txt('撤离点已就绪', fx, flag.y - flag.h - 12, TH.gold, 12, 'center');
      }
    }
  }
  if (ropeReady && !funMode) {
    var rx = rope.x - cam.x;
    for (var r2 = rope.top; r2 < rope.bot; r2 += 12) {
      rr(rx - 4, r2, 2, 12, '#a08a4a');
      rr(rx + 4, r2, 2, 12, '#a08a4a');
      rr(rx - 4, r2 + 5, 10, 2, '#c0a85a');
    }
  }
  if (ropeReady && !funMode) {
    var ax = plane.x - cam.x, ay = plane.y + Math.sin(elapsed / 400) * 4;
    rr(ax, ay + 12, 120, 14, '#2c3a22');
    rr(ax + 30, ay + 4, 16, 10, '#243019');
    rr(ax + 108, ay + 6, 20, 8, '#3a4a2a');
    rr(ax + 20, ay - 4, 54, 6, '#2c3a22');
    rr(ax + 118, ay - 2, 16, 6, '#3a4a2a');
    rr(ax + 40, ay + 26, 6, 8, '#1a2412');
    rr(ax + 80, ay + 26, 6, 8, '#1a2412');
    txt('撤离点', ax + 60, ay - 10, TH.gold, 11, 'center');
  }
}

function drawRedFlags() {
  if ((!redFlags || redFlags.length === 0) && !extractFlag) return;
  for (var fi = 0; fi < redFlags.length; fi++) {
    var r = redFlags[fi];
    var fx = r.x - cam.x;
    if (fx < -60 || fx > VW + 60) continue;
    var baseY = r.y;
    if (r.captured) {
      // 已夺取 → 我方复活点
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(elapsed / 200);
      rr(fx - 12, baseY - 54, 24, 54, TH.accent);
      ctx.globalAlpha = 1;
      rr(fx - 2, baseY - 46, 4, 46, '#9aa0a6');
      for (var i = 0; i < 12; i++) {
        var wv = Math.sin(elapsed / 220 + i * 0.5) * 2;
        rr(fx + 2 + i * 1.8, baseY - 44 + wv, 1.8, 16, TH.accent);
      }
      rr(fx - 30, baseY - 64, 60, 14, 'rgba(0,0,0,0.4)');
      txt('复活点', fx, baseY - 54, TH.accent, 11, 'center');
    } else {
      // 敌方红旗：刷敌 + 夺旗进度
      rr(fx - 2, baseY - 50, 4, 50, '#9aa0a6');
      for (var i2 = 0; i2 < 12; i2++) {
        var wv2 = Math.sin(elapsed / 180 + i2 * 0.5) * 2.5;
        rr(fx + 2 + i2 * 1.8, baseY - 48 + wv2, 1.8, 18, '#d83a2e');
      }
      rr(fx - 14, baseY - 4, 28, 4, '#7a1a14');
      if (r.holdT > 0) {
        var pr = Math.min(1, r.holdT / 5000);
        rr(fx - 22, baseY - 70, 44, 6, '#111');
        rr(fx - 21, baseY - 69, 42 * pr, 4, TH.accent);
        txt('夺旗中', fx, baseY - 80, TH.accent, 11, 'center');
      } else {
        ctx.globalAlpha = 0.22 + 0.14 * Math.sin(elapsed / 150);
        rr(fx - 18, baseY - 60, 36, 60, '#d83a2e');
        ctx.globalAlpha = 1;
        rr(fx - 36, baseY - 72, 72, 14, 'rgba(0,0,0,0.45)');
        txt('红旗·刷敌', fx, baseY - 62, '#ff7a6a', 11, 'center');
      }
    }
  }
  // 撤离点进攻红旗
  if (extractFlag) {
    var exf = extractFlag.x - cam.x;
    if (!(exf < -60 || exf > VW + 60)) {
      var eby = extractFlag.y;
      rr(exf - 2, eby - 50, 4, 50, '#9aa0a6');
      for (var ie = 0; ie < 12; ie++) {
        var ewv = Math.sin(elapsed / 180 + ie * 0.5) * 2.5;
        rr(exf + 2 + ie * 1.8, eby - 48 + ewv, 1.8, 18, '#d83a2e');
      }
      rr(exf - 14, eby - 4, 28, 4, '#7a1a14');
      ctx.globalAlpha = 0.22 + 0.14 * Math.sin(elapsed / 150);
      rr(exf - 18, eby - 60, 36, 60, '#d83a2e');
      ctx.globalAlpha = 1;
      rr(exf - 40, eby - 72, 80, 14, 'rgba(0,0,0,0.45)');
      txt('撤离点·刷敌', exf, eby - 62, '#ff7a6a', 11, 'center');
    }
  }
}
function drawKeyHouses() {
  if (funMode || !keyHouses || keyHouses.length === 0) return;
  for (var i = 0; i < keyHouses.length; i++) {
    var h = keyHouses[i];
    var dx = h.x - cam.x;
    if (dx < -70 || dx > VW + 70) continue;
    var baseY = h.y;
    if (h.opened) {
      ctx.globalAlpha = 0.35;
      rr(dx - 16, baseY - 54, 32, 54, '#3a3a2a');
      ctx.globalAlpha = 1;
      rr(dx - 12, baseY - 50, 24, 4, '#6a6a4a');
      continue;
    }
    rr(dx - 16, baseY - 56, 32, 56, '#2a2418');
    rr(dx - 13, baseY - 53, 26, 53, '#4a3a22');
    rr(dx - 10, baseY - 50, 20, 50, cardCol(h.lv));
    rr(dx - 3, baseY - 30, 6, 8, '#1a140a');
    txt('K' + h.lv, dx, baseY - 40, '#1a140a', 12, 'center');
    rr(dx - 22, baseY - 72, 44, 14, 'rgba(0,0,0,0.5)');
    txt('需K' + h.lv + '卡', dx, baseY - 61, '#ffe9a0', 11, 'center');
    if (h.extraction) {
      rr(dx - 40, baseY - 90, 80, 14, 'rgba(120,20,20,0.6)');
      txt('撤离点·开此门触发进攻', dx, baseY - 79, '#ff9a8a', 10, 'center');
    }
  }
}
function drawRedFlag() {
  var fx = redFlag.x - cam.x;
  if (fx < -60 || fx > VW + 60) return;
  var baseY = redFlag.y;
  rr(fx - 2, baseY - 50, 4, 50, '#9aa0a6');                       // 旗杆
  for (var i = 0; i < 12; i++) {
    var wv = Math.sin(elapsed / 180 + i * 0.5) * 2.5;
    rr(fx + 2 + i * 1.8, baseY - 48 + wv, 1.8, 18, '#d83a2e');     // 红旗面
  }
  rr(fx - 14, baseY - 4, 28, 4, '#7a1a14');                       // 底座
  if (redFlag.active) {                                            // 玩家离开：红色光晕 + 提示
    ctx.globalAlpha = 0.25 + 0.15 * Math.sin(elapsed / 150);
    rr(fx - 18, baseY - 60, 36, 60, '#d83a2e');
    ctx.globalAlpha = 1;
    rr(fx - 36, baseY - 72, 72, 14, 'rgba(0,0,0,0.45)');
    txt('红旗召唤中', fx, baseY - 62, '#ff7a6a', 11, 'center');
  }
}

/* ===================== HUD ===================== */
function drawHUD() {
  var p = player;
  rr(12, 12, 204, 18, '#0c1a0c'); rr(14, 14, 200, 14, '#22150f');
  rr(14, 14, 200 * Math.max(0, p.hp / p.maxHp), 14, p.hp > p.maxHp * 0.4 ? TH.green : TH.red);
  txt('HP ' + Math.max(0, Math.round(p.hp)) + '-' + Math.round(p.maxHp), 20, 26, TH.white, 12);
  var w = WEAPONS[p.wp];
  if (p.wp === 'knife') {
    txt('刀（近战）', 12, 52, '#cfd8e0', 15);
    txt('贴脸挥击 · 1秒/次 · 1/3血', 12, 72, '#9fb0a0', 13);
  } else if (p.noGun) {
    txt('无枪', 12, 52, TH.red, 15);
    txt('右键拾取武器', 12, 72, TH.red, 14);
  } else {
    var bL2 = player.bulletTier && player.bulletTier[p.wp] === 2;
    txt(w.name + (bL2 ? ' ★二级弹' : ''), 12, 52, bL2 ? '#ffcf3f' : TH.gold, 15);
    if (funMode) {
      txt('∞  无限弹药', 12, 72, TH.green, 14);
    } else {
      txt(p.mag[p.wp] + ' / ' + p.reserve, 12, 72, p.mag[p.wp] > 0 ? TH.white : TH.red, 14);
    }

function rank(r) {
  if (!r.win) return '—';
  var s = 100 - r.deaths * 8 + r.kills * 2;  if (s > 140) return 'S · 兵王';
  if (s > 110) return 'A · 老兵';

  return 'C · 幸存者';
}
