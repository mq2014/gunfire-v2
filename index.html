/* ===================== 主循环 ===================== */
var lastT = 0;
function frame(ts) {
  var dt = Math.min(48, ts - lastT || 16);
  lastT = ts;
  friendHeartbeat(dt);   // 好友在线状态实时心跳（轮询真实后端）
  presenceTick(dt);      // 上报自己的真实在线/游戏中状态到后端

  // 真实 1V1：实时同步 + 邀请轮询（函数内部已做节流）
  duelTickLoop(dt);
  duelInvitePollAcc += dt; if (duelInvitePollAcc >= 4000) { duelInvitePollAcc = 0; duelInvitePoll(); }
  duelWaitingPollAcc += dt; if (duelWaitingPollAcc >= 1500) { duelWaitingPollAcc = 0; duelWaitingPoll(); }
  if (state === 'spectate') spectateLoop(dt);

  if (state === 'mvscreen') {
    mvTimer -= dt;
    if (mvTimer <= 0 || just['Escape']) { duelMode = false; duelState = 'room'; state = 'duel'; duelLeaveReset(); }
  }
  if (state === 'play') update(dt);
  else if (just['Escape'] && state === 'pause') state = 'play';
  else if (just['Escape'] && (state === 'levelselect' || state === 'weaponselect' || state === 'funlevelselect' || state === 'manual')) state = 'home';
  else if (just['Escape'] && state === 'shop') state = shopPause ? 'play' : 'home';
  else if (just['Escape'] && state === 'bag') state = 'play';
  else if (just['KeyE'] && state === 'bag') state = 'play';
  else if (just['Escape'] && state === 'warehouse') state = 'shop';
  else if (just['Escape'] && state === 'duel') {
    if (duelState === 'waiting') { apiPostAuth('/api/duel-decline', { invite_id: duelInviteId }, loginToken).catch(function () {}); duelState = 'room'; duelMsg = '已取消邀请'; }
    else if (duelState === 'fight') { duelLeave(); state = 'home'; }
    else { duelMode = false; state = 'home'; }
  }
  else if (just['Escape'] && state === 'spectate') { exitSpectate(); }
  else if (just['Escape'] && state === 'friends') {
    if (blacklistView) { blacklistView = false; }
    else if (userListView) { userListView = false; }
    else if (statsView) { statsView = false; }
    else if (gfPassView) { gfPassView = false; }
    else if (friendReqView) { friendReqView = false; }
    else { friendPickMode = false; state = 'home'; }
  }

  ctx.save();
  if (shake > 0.4) ctx.translate((Math.random() * 2 - 1) * shake * 0.4, (Math.random() * 2 - 1) * shake * 0.4);

  if (state === 'home') drawHome();
  else if (state === 'levelselect') drawLevelSelect();
  else if (state === 'funlevelselect') drawFunLevelSelect();
  else if (state === 'weaponselect') drawWeaponSelect();
  else if (state === 'diffselect') drawDiffSelect();
  else if (state === 'shop') drawShop();
  else if (state === 'warehouse') drawWarehouse();
  else if (state === 'login') drawLogin();
  else if (state === 'manual') drawManual();
  else if (state === 'friends') drawFriends();
  else if (state === 'duel') drawDuelRoom();
  else if (state === 'mvscreen') drawMVP();
  else if (state === 'spectate') drawSpectate();
  else if (state === 'dead') { drawWorld(); drawHUD(); drawDeathMenu(); }
  else if (state === 'bag') { drawWorld(); drawHUD(); drawBag(); }
  else {
    drawWorld();
    drawHUD();
    drawBanner();
    if (state === 'pause') drawPause();
    if (state === 'result') drawResult();
  }
  drawDuelInviteModal();   // 收到真实 1V1 邀请时的弹窗（覆盖层，非对局界面才显示）
  ctx.restore();

  var btnList = state === 'home' ? homeBtns
    : state === 'pause' ? pauseBtns
    : state === 'result' ? resultBtns
    : state === 'levelselect' ? lsBtns
    : state === 'funlevelselect' ? flsBtns
    : state === 'weaponselect' ? wsBtns
    : state === 'diffselect' ? diffBtns
    : state === 'shop' ? shopBtns
    : state === 'warehouse' ? whBtns
    : state === 'login' ? loginBtns
    : state === 'manual' ? manualBtns
    : state === 'friends' ? (blacklistView ? blacklistBtns : (userListView ? userListBtns : (gfPassView ? passBtns : (friendReqView ? friendReqBtns : (statsView ? statBtns : friendBtns)))))
    : state === 'duel' ? duelBtns
    : state === 'mvscreen' ? mvBtns
    : state === 'dead' ? deadBtns
    : state === 'bag' ? bagBtns
    : [];
  if (mouse.click) {
    var handled = false;
    // 真实 1V1 邀请弹窗优先处理（覆盖在任意非对局界面之上）
    if (!handled && duelIncoming && duelModalBtns.length) {
      for (var mi = 0; mi < duelModalBtns.length; mi++) {
        var mr = duelModalBtns[mi].r;
        if (mouse.x > mr[0] && mouse.x < mr[0] + mr[2] && mouse.y > mr[1] && mouse.y < mr[1] + mr[3]) { duelModalBtns[mi].cb(); handled = true; break; }
      }
    }
    if (btnList.length) {
      for (var i = 0; i < btnList.length; i++) {
        var r = btnList[i].r;
        if (mouse.x > r[0] && mouse.x < r[0] + r[2] && mouse.y > r[1] && mouse.y < r[1] + r[3]) { btnList[i].cb(); handled = true; break; }
      }
    }
    if (!handled && state === 'play' && worldBtns.length) {
      for (var wi = 0; wi < worldBtns.length; wi++) {
        var wr = worldBtns[wi].r;
        if (mouse.x > wr[0] && mouse.x < wr[0] + wr[2] && mouse.y > wr[1] && mouse.y < wr[1] + wr[3]) { worldBtns[wi].cb(); handled = true; break; }
      }
    }
    if (handled) mouse.click = false;
  }
  // 右键点击：命中按钮的 rcb（仓库右键卖出 / 弹药区右键升级子弹 等）
  if (mouse.rclick && btnList.length) {
    for (var ri = 0; ri < btnList.length; ri++) {
      var rr2 = btnList[ri].r;
      if (mouse.x > rr2[0] && mouse.x < rr2[0] + rr2[2] && mouse.y > rr2[1] && mouse.y < rr2[1] + rr2[3]) {
        if (btnList[ri].rcb) btnList[ri].rcb();
        break;
      }
    }
  }
  if (state === 'home' && showHelp && mouse.click) { showHelp = false; mouse.click = false; }

  just = {};
  mouse.click = false;
  mouse.rclick = false;
  mouse.wheel = 0;
  lastMouseDown = mouse.down;
  requestAnimationFrame(frame);
}

function saveUsers(u) { try { localStorage.setItem('gf_users', JSON.stringify(u)); } catch (e) {} }
var loginToken = '';
function apiPost(path, body) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
    if (r.status >= 500) throw new Error('server ' + r.status);   // 服务器不可用 → 触发本地兜底
    return r.json();
  });
}
// 带 Bearer 鉴权的请求（好友系统接真实后端时用）
function apiPostAuth(path, body, token) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || '') }, body: JSON.stringify(body) }).then(function (r) {
    if (r.status >= 500) throw new Error('server ' + r.status);
    return r.json();
  });
}
function apiGet(path, token) {
  return fetch(path, { method: 'GET', headers: { 'Authorization': 'Bearer ' + (token || '') } }).then(function (r) {
    if (r.status >= 500) throw new Error('server ' + r.status);
    return r.json();
  });
}
function tryLogin() {
  var n = (loginFields.name || '').trim(), a = (loginFields.account || '').trim(), p = loginFields.password || '';
  if (!n || !a || !p) { loginMsg = '请填写名称、账号与密码'; return; }
  loginMsg = '连接服务器中…';
  apiPost('/api/login', { name: n, account: a, password: p }).then(function (res) {
    if (res && res.ok) {
      loginName = res.name; loginToken = res.token || '';
      backendFriends = !!loginToken;          // 拿到真实后端 token → 启用真实好友系统
      reportPresence('open');                 // 已开启游戏 → 向真实后端上报在线
      try { localStorage.setItem('gf_token', loginToken); localStorage.setItem('gf_name', loginName); } catch (e) {}
      pushLoginHistory(n, a, p);
      loginMsg = ''; state = 'home';
    } else if (res && res.msg) {
      loginMsg = res.msg;                          // 后端返回的具体错误（如名称已存在）
    } else {
      localLogin(n, a, p);                         // 后端不可用 → 回落本地账号
    }
  }).catch(function () { localLogin(n, a, p); });   // 网络/函数异常 → 回落本地账号
}
function localLogin(n, a, p) {
  backendFriends = false;                      // 本地兜底登录 → 不启用后端好友系统

  txt('「' + duelIncoming.fromName + '」邀请你进行真实 1V1 对战', VW / 2, 258, TH.white, 16, 'center');
  txt('（双方均为真实注册好友，对方同意后即开始）', VW / 2, 284, '#9ab08a', 13, 'center');
  var ax = VW / 2 - 185, bx2 = VW / 2 + 25, by = 320, bw = 160, bh = 46;
  var aHov = mouse.x > ax && mouse.x < ax + bw && mouse.y > by && mouse.y < by + bh;
  var bHov = mouse.x > bx2 && mouse.x < bx2 + bw && mouse.y > by && mouse.y < by + bh;
  rr(ax, by, bw, bh, aHov ? '#241812' : '#1a120e'); rr(ax, by, bw, 2, '#e0a04a');
  txt('同 意 开 战', ax + bw / 2, by + 30, aHov ? TH.white : '#bfe0b0', 16, 'center');
  rr(bx2, by, bw, bh, bHov ? '#3a1a1a' : '#221010'); rr(bx2, by, bw, 2, '#aa5555');
  txt('拒 绝', bx2 + bw / 2, by + 30, bHov ? TH.white : '#d99', 16, 'center');
  duelModalBtns.push({ r: [ax, by, bw, bh], cb: acceptDuelInvite });
  duelModalBtns.push({ r: [bx2, by, bw, bh], cb: declineDuelInvite });
}
function drawMVP() {

  txt('M V P', VW / 2, 150, '#e0a04a', 56, 'center');
  txt(r.win ? '你 获 胜 !' : '对 手 获 胜', VW / 2, 230, r.win ? '#e0a04a' : '#ff6a5a', 40, 'center');
  txt('比分　你 ' + (r.me || 0) + ' : ' + (r.op || 0) + ' ' + (r.opponent || '对手'), VW / 2, 290, TH.white, 22, 'center');

}

TH = Object.assign({}, BASE, LEVELS[0].theme);
genWorld(0);
player = newPlayer();
stats = { kills: 0, deaths: 0, killStreak: 0, shots: 0 };

try { var _t = localStorage.getItem('gf_token'); var _n = localStorage.getItem('gf_name'); if (_t) { loginToken = _t; if (_n) loginName = _n; backendFriends = true; state = 'home'; reportPresence('open'); } } catch (e) {}
initFriends();                  // 载入/初始化好友列表（含在线/离线状态，持久化到 localStorage）
loadLoginHistory();             // 载入登录历史（右侧面板，名称/账号/密码打码显示）
if (typeof window !== 'undefined' && window.addEventListener) {
  // 关闭/刷新页面时向真实后端上报离线（best-effort）
